      --bg-app: #f3f4f6;
      --bg-card: #ffffff;
      --bg-muted: #f9fafb;
      --border-color: #e5e7eb;
      --primary: #111827;
      --primary-hover: #1f2937;
      --accent-green: #16a34a;
      --accent-green-bg: #ecfdf5;
      --accent-green-border: #a7f3d0;
      --accent-red: #dc2626;
      --accent-red-bg: #fef2f2;
      --accent-red-border: #fecaca;
      --text-main: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      min-height: 100vh;
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 0.5rem;
      background-color: var(--bg-app);
    }

    @media (min-width: 640px) {
      .top-header {
        padding: 0.75rem 1rem;
      }
    }

    .header-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 0.625rem 0.875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand-title {
      font-size: 0.9375rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 0.6875rem;
      color: var(--text-muted);
      display: none;
    }

    @media (min-width: 640px) {
      .brand-sub {
        display: inline;
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.375rem 0.625rem;
      border-radius: 9999px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      z-index: 50;
    }

    .status-badge.connected {
      background-color: var(--accent-green-bg);
      color: #065f46;
      border-color: var(--accent-green-border);
    }

    .status-badge.disconnected {
      background-color: var(--accent-red-bg);
      color: #991b1b;
      border-color: var(--accent-red-border);
    }

    .tab-bar-container {
      margin-top: 0.375rem;
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: 0.25rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .tab-nav {
      display: flex;
      gap: 0.25rem;
      background-color: #f3f4f6;
      padding: 0.25rem;
      border-radius: var(--radius-sm);
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    @media (min-width: 640px) {
      .tab-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
      }
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: var(--primary);
      font-weight: 800;
      box-shadow: var(--shadow-sm);
    }

    .main-content {
      flex: 1;
      display: flex;
      width: 100%;
    }

    .generator-split {
      display: flex;
      width: 100%;
      flex-direction: column;
    }

    @media (min-width: 1024px) {

        flex-direction: row;
      }

    .form-panel {
      width: 100%;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      padding: 0.875rem;
    }

    @media (min-width: 640px) {
      .form-panel {
        padding: 1.25rem;
      }
    }

    @media (min-width: 1024px) {
      .form-panel {
        width: 380px;
        flex-shrink: 0;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
      }
    }

    .preview-panel {
      flex: 1;
      padding: 0.5rem;
      background-color: #eef0f3;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

    @media (min-width: 640px) {

      }

    .form-section {

    .section-title {
      font-size: 0.8125rem;
      font-weight: 700;
      margin-bottom: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .form-label {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-family: inherit;
      background-color: #ffffff;
      outline: none;
      min-height: 40px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.375rem;
    }

    .btn {

      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 700;

      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      min-height: 42px;
      touch-action: manipulation;

    .btn-outline { background-color: #ffffff; border-color: #d1d5db; color: var(--text-main); }

      margin-bottom: 8px;

      font-weight: 700;
      text-align: center;

      height: 70px;

        align-items: center;

      border-bottom: 1px solid #f3f4f6;

      inset: 0;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 60;

      align-items: center;
      justify-content: center;

        page-break-inside: avoid;

  <!-- Global Error Handler -->
  <script>
    window.__appErrors = [];
    function showError(msg, detail) {
      window.__appErrors.push({msg: msg, detail: detail, time: new Date().toISOString()});
      console.error('[AppError]', msg, detail);
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML =
        '<div style="padding:1.5rem;text-align:center;font-family:sans-serif;max-width:520px;margin:0 auto;">' +
        '<div style="font-size:2rem;margin-bottom:0.5rem;">⚠️</div>' +
        '<h2 style="color:#dc2626;font-size:1.1rem;font-weight:800;margin-bottom:0.5rem;">앱 로딩 오류</h2>' +
        '<p style="color:#374151;font-size:0.85rem;margin-bottom:0.75rem;">' + msg + '</p>' +
        '<div style="font-size:0.7rem;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;padding:8px 10px;border-radius:6px;text-align:left;word-break:break-all;margin-bottom:1rem;">' + (detail||'') + '</div>' +
        '<button onclick="location.href=location.pathname+'?v='+Date.now()" style="padding:0.6rem 1.25rem;background:#1d4ed8;color:white;border:none;border-radius:8px;font-weight:700;font-size:0.875rem;cursor:pointer;">🔄 새로고침</button>' +
        '</div>';
    }
    window.onerror = function(msg, src, line, col, err) {
      var detail = '오류: ' + msg + ' | 위치: ' + (src||'') + ':' + (line||0) + ':' + (col||0) + (err && err.stack ? ' | 스택: ' + err.stack.substring(0,300) : '');
      showError('스크립트 오류가 발생했습니다.', detail);
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.message || String(e.reason)) : String(e);
      showError('비동기 오류가 발생했습니다.', '원인: ' + reason);
    });
    // Diagnostic: check each CDN dependency loaded correctly
    window.addEventListener('load', function() {
      var missing = [];
      if (!window.React) missing.push('React');
      if (!window.ReactDOM) missing.push('ReactDOM');
      if (missing.length > 0) {
        showError('필수 라이브러리를 불러오지 못했습니다.', '로드 실패: ' + missing.join(', ') + ' | 네트워크를 확인하고 새로고침해 주세요.');
      }
    });
  </script>
