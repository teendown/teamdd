<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEAM D.D - 거래명세서 작성 및 고객/공급자/부품 관리</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TEAM D.D">
  <link rel="apple-touch-icon" href="./icon-512.jpg">
  <meta name="theme-color" content="#02457A">

  <!-- Pretendard & Inter Web Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="./css/base.css?v=2.1.0">
  <link rel="stylesheet" href="./css/layout.css?v=2.1.0">
  <link rel="stylesheet" href="./css/components.css?v=2.1.0">
  <link rel="stylesheet" href="./css/modals.css?v=2.1.0">
  <link rel="stylesheet" href="./css/print.css?v=2.1.0">
  <link rel="stylesheet" href="./style.css?v=2.1.0">
  <link rel="stylesheet" href="./src/App.css?v=2.1.0">

  <!-- Export Helpers & Database CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div id="loading-indicator" style="padding:2rem;text-align:center;font-family:sans-serif;color:#6b7280;font-size:0.9rem;">
    ⏳ 앱 로딩 중...
  </div>
  <div id="root"></div>

  <!-- Global Error Boundary Fallback -->
  <script>
    window.__appErrors = [];
    function showError(msg, detail) {
      window.__appErrors.push({ msg: msg, detail: detail, time: new Date().toISOString() });
      console.error('[AppError]', msg, detail);
      var loading = document.getElementById('loading-indicator');
      if (loading) loading.style.display = 'none';
      var root = document.getElementById('root');
      if (!root) return;
      var btn = document.createElement('button');
      btn.textContent = '🔄 새로고침';
      btn.style.cssText = 'padding:0.6rem 1.25rem;background:#1d4ed8;color:white;border:none;border-radius:8px;font-weight:700;font-size:0.875rem;cursor:pointer;margin-top:1rem;';
      btn.onclick = function() { location.href = location.pathname + '?v=' + Date.now(); };
      var wrap = document.createElement('div');
      wrap.style.cssText = 'padding:1.5rem;text-align:center;font-family:sans-serif;max-width:520px;margin:0 auto;';
      wrap.innerHTML = '<div style="font-size:2rem;margin-bottom:0.5rem;">⚠️</div>' +
        '<h2 style="color:#dc2626;font-size:1.1rem;font-weight:800;margin-bottom:0.5rem;">앱 로딩 오류</h2>' +
        '<p style="color:#374151;font-size:0.85rem;margin-bottom:0.75rem;">' + msg + '</p>' +
        '<div style="font-size:0.7rem;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;padding:8px 10px;border-radius:6px;text-align:left;word-break:break-all;margin-bottom:1rem;">' + (detail || '') + '</div>';
      wrap.appendChild(btn);
      root.innerHTML = '';
      root.appendChild(wrap);
    }
    window.onerror = function(msg, src, line, col, err) {
      var detail = 'msg: ' + msg + ' | src: ' + (src || '') + ':' + (line || 0) + ':' + (col || 0) + (err && err.stack ? ' | stack: ' + String(err.stack).substring(0, 400) : '');
      showError('스크립트 오류가 발생했습니다.', detail);
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.message || String(e.reason)) : String(e);
      showError('비동기 오류가 발생했습니다.', '원인: ' + reason);
    });
  </script>

  <!-- High-Performance Bundled Application Entry -->
  <script src="./app.bundle.js?v=2.1.5"></script>
</body>
</html>
