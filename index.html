  <!-- React 18 & ReactDOM CDN (jsDelivr Global Network) -->

  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./style.css?v=2.0">

  <style>
    /* 🎨 TEAM D.D UNIFIED DESIGN SYSTEM (5-Color Blue/Navy Palette) */
    :root {
      --font-main: "Pretendard", -apple-system, BlinkMacSystemFont, "NanumSquare Neo", "NanumSquare", "Malgun Gothic", "맑은 고딕", sans-serif;
      
      /* 🎨 사용자 제공 5대 핵심 블루/네이비 팔레트 */
      --c-navy-dark: #001B48;     /* 딥 다크 네이비 (헤더, 타이틀, 본문 볼드 텍스트) */
      --c-navy-primary: #02457A;  /* 클래식 네이비 (주 버튼, 메인 브랜드 포인트) */
      --c-navy-hover: #01345D;    /* 네이비 호버 */
      --c-blue-accent: #018ABE;   /* 오션 블루 (강조 버튼, 액티브 탭, 서브 포인트) */
      --c-blue-hover: #0175A2;    /* 오션 블루 호버 */
      --c-blue-soft: #97CADB;     /* 파스텔 스카이 블루 (보더, 호버 배경, 소프트 뱃지) */
      --c-blue-light: #D6E8EE;    /* 쿨 아이스 블루 (배경 트랙, 칩, 연한 뱃지 배경) */
      --c-blue-lightest: #F2F7FA; /* 초경량 틴트 배경 */

      --bg-app: #F4F7F9;
      --bg-card: #FFFFFF;
      --bg-muted: #F8FAFC;
      
      --border-color: #D6E8EE;
      --border-strong: #97CADB;
      --border-hover: #018ABE;
      
      --primary: #02457A;
      --primary-hover: #01345D;
      --primary-dark: #001B48;
      
      --accent-blue: #018ABE;
      --accent-blue-bg: #D6E8EE;
      --accent-blue-border: #97CADB;

      --accent-red: #D92D20;
      --accent-red-bg: #FEF3F2;
      --accent-red-border: #FECDCA;

      --accent-green: #028A3E;
      --accent-green-bg: #E8F8F0;
      --accent-green-border: #A3E9C4;

      --text-main: #001B48;
      --text-secondary: #02457A;
      --text-muted: #64748B;
      
      /* 규격 표준화: 모든 버튼 및 인풋 높이 38px 통일 */
      --control-height: 38px;
      --control-height-sm: 32px;
      
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 3px rgba(0, 27, 72, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 27, 72, 0.08);
      --shadow-lg: 0 10px 24px rgba(0, 27, 72, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.02em;
    }

    html, body, #root {
      min-height: 100vh;
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .management-container, .tab-content {
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      padding: 0.75rem;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 0.5rem;
      background-color: var(--bg-app);
    }

    @media (min-width: 640px) {
      .top-header {
        padding: 0.75rem 1rem;
      }
    }

    .header-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 0.625rem 0.875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--c-navy-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title span {
      color: var(--c-blue-accent);
    }

    .brand-sub {
      font-size: 0.6875rem;
      color: var(--text-muted);
      display: none;
      font-weight: 600;
    }

    @media (min-width: 640px) {
      .brand-sub {
        display: inline;
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.375rem 0.625rem;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      z-index: 50;
      transition: all 0.2s ease;
    }

    .status-badge.connected {
      background-color: var(--c-blue-light);
      color: var(--c-navy-primary);
      border-color: var(--c-blue-soft);
    }

    .status-badge.disconnected {
      background-color: var(--accent-red-bg);
      color: var(--accent-red);
      border-color: var(--accent-red-border);
    }

    .tab-bar-container {
      margin-top: 0.375rem;
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: 0.25rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .tab-nav {
      display: flex;
      gap: 0.25rem;
      background-color: var(--c-blue-light);
      padding: 0.25rem;
      border-radius: var(--radius-sm);
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      height: var(--control-height);
      min-height: var(--control-height);
      padding: 0 0.5rem;
      font-size: 0.8125rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--c-navy-primary);
      border-radius: var(--radius-xs);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .tab-btn {
        padding: 0 1rem;
        font-size: 0.8125rem;
      }
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: var(--c-navy-dark);
      font-weight: 900;
      box-shadow: 0 1px 3px rgba(0, 27, 72, 0.12);
      border: 1px solid var(--c-blue-soft);
    }

    .main-content {
      flex: 1;
      display: flex;
      width: 100%;
    }

    .generator-split {
      display: flex;
      width: 100%;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .generator-split {
        flex-direction: row;
      }
    }

    .form-panel {
      width: 100%;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      padding: 0.875rem;
    }

    @media (min-width: 640px) {
      .form-panel {
        padding: 1.25rem;
      }
    }

    @media (min-width: 1024px) {
      .form-panel {
        width: 380px;
        flex-shrink: 0;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
      }
    }

    .preview-panel {
      flex: 1;
      padding: 0.5rem;
      background-color: var(--c-blue-lightest);
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 500px;
    }

    @media (min-width: 640px) {
      .preview-panel {
        padding: 1.25rem;
      }
    }

    .form-section {
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 0.8125rem;
      font-weight: 800;
      margin-bottom: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--c-navy-dark);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .form-label {
      font-size: 0.75rem;
      color: var(--c-navy-primary);
      font-weight: 700;
    }

    /* ── 표준 입력창 및 셀렉트 (높이 38px 통일) ── */
    .form-input, .form-select, .form-textarea {
      width: 100%;
      height: var(--control-height);
      min-height: var(--control-height);
      padding: 0 0.75rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-family: inherit;
      background-color: #ffffff;
      outline: none;
      color: var(--text-main);
      transition: all 0.15s ease;
    }
    .form-textarea {
      height: auto;
      min-height: 80px;
      padding: 0.5rem 0.75rem;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--c-blue-accent);
      box-shadow: 0 0 0 3px rgba(1, 138, 190, 0.15);
    }

    /* Canvas Direct Cell Editing Inputs */
    .canvas-input {
      width: 100%;
      height: 100%;
      min-height: 20px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      text-align: inherit;
      outline: none;
      padding: 1px 2px;
      margin: 0;
      box-sizing: border-box;
      cursor: text;
      display: block;
    }
    .canvas-input:hover {
      background-color: var(--c-blue-light) !important;
      box-shadow: inset 0 0 0 1px var(--c-blue-accent) !important;
      border-radius: 2px;
    }
    .canvas-input:focus {
      background-color: #ffffff !important;
      box-shadow: inset 0 0 0 2px var(--c-blue-accent) !important;
      border-radius: 2px;
    }
    @media print {
      .canvas-input {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.375rem;
    }

    /* ── 🎨 통일된 버튼 시스템 (높이 38px & 명확한 대비 규칙) ── */
    .btn {
      height: var(--control-height);
      min-height: var(--control-height);
      max-height: var(--control-height);
      padding: 0 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      touch-action: manipulation;
      white-space: nowrap;
    }

    /* 색상 채움 버튼: 무조건 흰색 글자 */
    .btn-primary, .btn-navy {
      background-color: var(--c-navy-primary);
      color: #ffffff !important;
      box-shadow: 0 1px 2px rgba(2, 69, 122, 0.2);
    }
    .btn-primary:hover, .btn-navy:hover {
      background-color: var(--c-navy-hover);
    }
    .btn-primary:active, .btn-navy:active {
      background-color: var(--c-navy-dark);
    }

    .btn-blue, .btn-green {
      background-color: var(--c-blue-accent);
      color: #ffffff !important;
      box-shadow: 0 1px 2px rgba(1, 138, 190, 0.2);
    }
    .btn-blue:hover, .btn-green:hover {
      background-color: var(--c-blue-hover);
    }

    /* 흰색/밝은 배경 버튼: 무조건 검정/딥네이비(#001B48) 글자 */
    .btn-outline {
      background-color: #ffffff;
      border: 1px solid var(--border-strong);
      color: var(--c-navy-dark) !important;
    }
    .btn-outline:hover {
      background-color: var(--c-blue-lightest);
      border-color: var(--c-blue-accent);
    }

    .btn-light {
      background-color: var(--c-blue-light);
      border: 1px solid var(--c-blue-soft);
      color: var(--c-navy-dark) !important;
    }
    .btn-light:hover {
      background-color: var(--c-blue-soft);
    }

    .btn-danger {
      background-color: var(--accent-red);
      color: #ffffff !important;
    }

    .btn-red-outline {
      background-color: var(--accent-red-bg);
      border: 1px solid var(--accent-red-border);
      color: var(--accent-red) !important;
    }
    .btn-red-outline:hover {
      background-color: #FEE4E2;
    }

    .btn-sm {
      height: var(--control-height-sm);
      min-height: var(--control-height-sm);
      max-height: var(--control-height-sm);
      padding: 0 0.625rem;
      font-size: 0.75rem;
    }

    .item-card {
      background-color: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.625rem;
      margin-bottom: 0.5rem;
    }

    .item-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.375rem;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 65px 1fr 1fr;
      gap: 0.375rem;
    }

    /* Mobile Scaled A4 Preview Box */
    .document-page-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      margin-bottom: 1.5rem;
      max-width: 100%;
      overflow-x: auto;
    }

    .document-page {
      width: 800px;
      min-height: 1131px;
      padding: 40px;
      background-color: #ffffff;
      color: #000000;
      box-sizing: border-box;
      position: relative;
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .doc-title-main {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 6px;
      padding: 8px 0;
      border-bottom: 2px solid #000000;
      margin-bottom: 12px;
    }

    .doc-info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .parties-table, .items-table, .doc-totals-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .parties-table th, .parties-table td,
    .items-table th, .items-table td,
    .doc-totals-table td {
      border: 1px solid #000000;
      padding: 5px 8px;
      font-size: 11px;
    }

    .parties-table th, .items-table th {
      background-color: #f3f4f6;
      font-weight: 700;
      text-align: center;
    }

    .stamp-box {
      position: absolute;
      right: 50px;
      bottom: 120px;
      width: 70px;
      height: 70px;
      border: 2px solid #dc2626;
      border-radius: 50%;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      transform: rotate(-12deg);
      opacity: 0.85;
    }

    .management-container {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem;
      width: 100%;
    }

    @media (min-width: 640px) {
      .management-container {
        padding: 1.25rem;
      }
    }

    .card-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-box-header {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (min-width: 640px) {
      .card-box-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    /* Mobile Cards vs Desktop Table */
    .mobile-cards-view {
      display: block;
      padding: 0.75rem;
    }

    .desktop-table-view {
      display: none;
    }

    @media (min-width: 768px) {
      .mobile-cards-view { display: none; }
      .desktop-table-view { display: block; }
    }

    .mobile-data-card {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.875rem;
      margin-bottom: 0.625rem;
      box-shadow: var(--shadow-sm);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    .data-table th {
      background-color: var(--bg-muted);
      color: var(--text-secondary);
      font-size: 0.6875rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.625rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid #f3f4f6;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }

    .modal-content {
      background-color: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1rem;
    }

    @page {
      size: A4 portrait;
      margin: 0mm;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #ffffff !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .top-header, .tab-bar-container, .form-panel, .modal-overlay, button, .status-badge {
        display: none !important;
      }
      .preview-panel {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        overflow: visible !important;
        display: block !important;
        width: 210mm !important;
      }
      .document-page-wrapper {
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        transform: none !important;
        page-break-after: always;
        page-break-inside: avoid;
      }
      .document-page {
        width: 210mm !important;
        min-height: 297mm !important;

  <script>
    window.__appErrors = [];
    function showError(msg, detail) {
      window.__appErrors.push({msg: msg, detail: detail, time: new Date().toISOString()});
      console.error('[AppError]', msg, detail);
      var loading = document.getElementById('loading-indicator');
      if (loading) loading.style.display = 'none';
      var root = document.getElementById('root');
      if (!root) return;
      var btn = document.createElement('button');
      btn.textContent = '\uD83D\uDD04 \uC0C8\uB85C\uACE0\uCE68';
      btn.style.cssText = 'padding:0.6rem 1.25rem;background:#1d4ed8;color:white;border:none;border-radius:8px;font-weight:700;font-size:0.875rem;cursor:pointer;margin-top:1rem;';
      btn.onclick = function() { location.href = location.pathname + '?v=' + Date.now(); };
      var wrap = document.createElement('div');
      wrap.style.cssText = 'padding:1.5rem;text-align:center;font-family:sans-serif;max-width:520px;margin:0 auto;';
      wrap.innerHTML = '<div style="font-size:2rem;margin-bottom:0.5rem;">\u26A0\uFE0F</div>' +
        '<h2 style="color:#dc2626;font-size:1.1rem;font-weight:800;margin-bottom:0.5rem;">' + '\uC571 \uB85C\uB529 \uC624\uB958' + '</h2>' +
        '<p style="color:#374151;font-size:0.85rem;margin-bottom:0.75rem;">' + msg + '</p>' +
        '<div style="font-size:0.7rem;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;padding:8px 10px;border-radius:6px;text-align:left;word-break:break-all;margin-bottom:1rem;">' + (detail || '') + '</div>';
      wrap.appendChild(btn);
      root.innerHTML = '';
      root.appendChild(wrap);

    window.onerror = function(msg, src, line, col, err) {
      var detail = 'msg: ' + msg + ' | src: ' + (src || '') + ':' + (line || 0) + ':' + (col || 0) + (err && err.stack ? ' | stack: ' + String(err.stack).substring(0, 400) : '');

      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.message || String(e.reason)) : String(e);
      showError('\uBE44\uB3D9\uAE30 \uC624\uB958\uAC00 \uBC1C\uC0DD\uD588\uC2B5\uB2C8\uB2E4.', '\uC6D0\uC778: ' + reason);
    });
    window.addEventListener('load', function() {
      var missing = [];
      if (!window.React) missing.push('React');

let _sbClient = null;
let _sbUrl = '';
let _sbKey = '';
function getSupabaseClient() {
  const url = (localStorage.getItem('supabase_url') || '').trim();
  const key = (localStorage.getItem('supabase_anon_key') || '').trim();
  if (!url || !key) return null;
  if (_sbClient && url === _sbUrl && key === _sbKey) return _sbClient;
  try {
    _sbClient = window.supabase.createClient(url, key, {
      auth: {
        persistSession: false,
        autoRefreshToken: false
      }
    });
    _sbUrl = url;
    _sbKey = key;
    return _sbClient;
  } catch (e) {
    return null;
  }
}

// ── DB CRUD helpers ────────────────────────────────────────────────────────
function packRow(r, table) {
  if (table !== 'customers' && table !== 'suppliers' && table !== 'documents') return { ...r };
  let standardCols = [];
  if (table === 'customers') {
    standardCols = ['id', 'created_at', 'code', 'name', 'bizno', 'person', 'phone', 'addr', 'machine', 'memo'];
  } else if (table === 'suppliers') {
    standardCols = ['id', 'created_at', 'code', 'name', 'bizno', 'person', 'phone', 'tel', 'bank', 'addr', 'memo'];
  } else if (table === 'documents') {
    standardCols = ['id', 'created_at', 'doc_type', 'doc_no', 'doc_date', 'doc_time', 'customer_name', 'customer_data', 'supplier_key', 'supplier_data', 'items', 'vat', 'vat_included', 'paid', 'remark'];
  }
  const payload = { ...r };
  const extraFields = {};
  for (const key of Object.keys(payload)) {
    if (!standardCols.includes(key)) {
      extraFields[key] = payload[key];
      delete payload[key];
    }
  }
  if (Object.keys(extraFields).length > 0) {
    if (table === 'documents') {
      payload.remark = (payload.remark || '') + '\n---EXT---\n' + JSON.stringify(extraFields);
    } else {
      payload.memo = (payload.memo || '') + '\n---EXT---\n' + JSON.stringify(extraFields);
    }
  }
  return payload;
}

function unpackRow(r) {
  if (!r) return r;
  if (r.memo && r.memo.includes('\n---EXT---\n')) {
    const parts = r.memo.split('\n---EXT---\n');
    r.memo = parts[0];
    try { Object.assign(r, JSON.parse(parts[1])); } catch(e) {}
  }
  if (r.remark && r.remark.includes('\n---EXT---\n')) {
    const parts = r.remark.split('\n---EXT---\n');
    r.remark = parts[0];
    try { Object.assign(r, JSON.parse(parts[1])); } catch(e) {}
  }
  return r;
}

function areSupplierKeysEquivalent(key1, key2) {
  if (!key1 || !key2) return false;
  if (key1 === key2) return true;
  const sejinKeys = ['sejin', 'cc76e46a-935a-455b-9070-0a4465035c19'];
  const gimjeKeys = ['ds_gimje', '767fd9c8-d5e9-46b0-a7c4-713dac601ae4'];
  if (sejinKeys.includes(key1) && sejinKeys.includes(key2)) return true;
  if (gimjeKeys.includes(key1) && gimjeKeys.includes(key2)) return true;
  return false;
}

async function dbFetch(table, fallback, orderCol = 'code') {

  if (sb) {

      const {
        data,
        error
      } = await sb.from(table).select('*').order(orderCol, {
        ascending: true
      });
      if (!error && Array.isArray(data) && data.length > 0) {
        let unpacked = data.map(unpackRow);
        setLocalItem('dd_' + table + '_list_v1', unpacked);
        
        // 고객 목록 중복 제거 및 DB 정리
        if (table === 'customers') {

        }
        
        // 공급자별 격리 필터 (거래처 customers는 전체 공급자 공유)
        if (userRole === 'supplier') {
          if (table === 'parts') {
            unpacked = unpacked.filter(item => !item.supplier_key || areSupplierKeysEquivalent(item.supplier_key, selectedSupplierKey));
          }
        }
        return unpacked;
      }
    } catch (e) { console.error(e); }
  }
  
  let list = getLocalItem('dd_' + table + '_list_v1', fallback).map(unpackRow);
  if (table === 'customers') {

  }
  if (userRole === 'supplier') {
    if (table === 'parts') {
      list = list.filter(item => !item.supplier_key || areSupplierKeysEquivalent(item.supplier_key, selectedSupplierKey));
    }
  }
  return list;
}

// 고객 목록 중복 자동 제거 및 Supabase DB 정리
async function deduplicateCustomers(custList) {
  if (!custList || custList.length === 0) return custList;
  
  const map = new Map();
  const duplicateIdsToDelete = [];

  custList.forEach(c => {
    if (!c || !c.name || !c.name.trim() || c.name.trim() === '미지정') return;
    const key = c.name.trim().toLowerCase();
    
    if (!map.has(key)) {
      map.set(key, { ...c });
    } else {
      // 중복 발견! 정보 병합 후 중복 ID 수집
      const existing = map.get(key);
      if (c.id && c.id !== existing.id) {
        duplicateIdsToDelete.push(c.id);
      }
      if (!existing.phone && c.phone) existing.phone = c.phone;
      if (!existing.person && c.person) existing.person = c.person;
      if (!existing.addr && c.addr) existing.addr = c.addr;
      if (!existing.bizno && c.bizno) existing.bizno = c.bizno;
      if (!existing.machine && c.machine) existing.machine = c.machine;
    }
  });

  // 코드 번호 순차 정렬 및 부여
  const cleaned = Array.from(map.values()).map((c, idx) => ({
    ...c,
    code: `C${String(idx + 1).padStart(4, '0')}`
  }));

  setLocalItem('dd_customers_list_v1', cleaned);

  // Supabase 원격 DB에서 중복 레코드 삭제
  if (duplicateIdsToDelete.length > 0) {
    const sb = getSupabaseClient();
    if (sb) {
      try {
        await sb.from('customers').delete().in('id', duplicateIdsToDelete);
        console.log(`Cleaned up ${duplicateIdsToDelete.length} duplicate customers from Supabase.`);
      } catch (e) {
        console.error('Failed to clean up duplicate customers from Supabase:', e);
      }
    }
  }

  return cleaned;
}

// 과거 및 현재 모든 문서에 등장하는 거래처를 customers 고객 마스터로 전수 자동 등록 및 통합
async function syncCustomersFromDocuments(currentCusts, currentDocs) {
  if (!currentDocs || currentDocs.length === 0) return currentCusts || [];
  
  const custMap = new Map();
  // 1. 기존 고객 마스터 등록
  (currentCusts || []).forEach(c => {
    if (c && c.name && c.name.trim() && c.name.trim() !== '미지정') {
      custMap.set(c.name.trim().toLowerCase(), { ...c });
    }
  });

  let hasNew = false;
  const newCustsToSave = [];

  // 2. 문서 전수 스캔 및 거래처 흡수
  currentDocs.forEach(doc => {
    const rawName = (doc.customer_name || doc.customer_data?.name || '').trim();
    if (!rawName || rawName === '미지정') return;
    
    const key = rawName.toLowerCase();
    const docCust = doc.customer_data || {};
    
    if (!custMap.has(key)) {
      // 새로운 고객 마스터 생성!
      const newCustomer = {
        id: 'cust_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
        code: `C${String(custMap.size + 1).padStart(4, '0')}`,
        name: rawName,
        person: docCust.person || docCust.repName || '',
        phone: docCust.phone || '',
        addr: docCust.addr || '',
        bizno: docCust.bizno || '',
        repName: docCust.repName || docCust.person || '',
        machine: docCust.machine || docCust.selectedMachine || '',
        memo: '과거 발행 문서에서 자동 등록됨'
      };
      custMap.set(key, newCustomer);
      newCustsToSave.push(newCustomer);
      hasNew = true;
    } else {
      // 이미 존재하는 고객이라도, 연락처/주소 등이 비어있고 문서에 정보가 있으면 보충
      const existing = custMap.get(key);
      let updated = false;
      if (!existing.phone && docCust.phone) { existing.phone = docCust.phone; updated = true; }
      if (!existing.person && docCust.person) { existing.person = docCust.person; updated = true; }
      if (!existing.addr && docCust.addr) { existing.addr = docCust.addr; updated = true; }
      if (!existing.bizno && docCust.bizno) { existing.bizno = docCust.bizno; updated = true; }
      if (updated) hasNew = true;
    }
  });

  let mergedList = Array.from(custMap.values());
  mergedList = await deduplicateCustomers(mergedList);

  if (hasNew && newCustsToSave.length > 0) {
    const sb = getSupabaseClient();
    if (sb) {
      try {
        for (const nc of newCustsToSave) {
          const packed = packRow(nc, 'customers');
          const { id, created_at, ...payload } = packed;
          await sb.from('customers').insert(payload);
        }
      } catch (e) { console.error('Auto-sync customers insert error:', e); }
    }
  }

  return mergedList;
}

async function dbSave(table, rowData, isEdit = false, currentList = []) {
  const sb = getSupabaseClient();
  const userRole = sessionStorage.getItem('dd_user_role') || 'supplier';
  const selectedSupplierKey = sessionStorage.getItem('selected_supplier_key') || localStorage.getItem('selected_supplier_key') || 'sejin';
  
  // 공급자별 수정 권한 체크 및 바인딩 (거래처 customers는 전원 공유/수정 가능)
  if (userRole === 'supplier') {
    if (table === 'suppliers') {
      if (!areSupplierKeysEquivalent(rowData.id, selectedSupplierKey)) {
        alert('본인의 공급자 정보만 수정할 수 있습니다.');
        return currentList;
      }
    } else if (table === 'parts') {
      rowData.supplier_key = selectedSupplierKey;
      if (isEdit && rowData.id) {
        const found = currentList.find(r => r.id === rowData.id);
        if (found && found.supplier_key && !areSupplierKeysEquivalent(found.supplier_key, selectedSupplierKey)) {
          alert('해당 데이터를 수정할 권한이 없습니다.');
          return currentList;
        }
      }
    }
  }

  let serverRow = null;
  if (sb) {
    try {
      const packedData = packRow(rowData, table);
      if (isEdit && rowData.id) {
        const { id, created_at, ...payload } = packedData;
        const { data, error } = await sb.from(table).update(payload).eq('id', id).select().single();
        if (!error) serverRow = unpackRow(data);
        else { console.error('Supabase update error:', error); alert('Supabase update error: ' + (error.message || JSON.stringify(error))); }
      } else {
        const { id, created_at, ...payload } = packedData;
        const { data, error } = await sb.from(table).insert(payload).select().single();
        if (!error) serverRow = unpackRow(data);
        else { console.error('Supabase insert error:', error); alert('Supabase insert error: ' + (error.message || JSON.stringify(error))); }
      }
    } catch (e) { console.error(e); }
  }
  let updated;
  if (isEdit && rowData.id) {
    updated = currentList.map(r => r.id === rowData.id ? { ...r, ...(serverRow || rowData) } : r);
  } else {
    const fallbackId = isEdit && rowData.id ? rowData.id : (table + '_' + Date.now() + Math.random().toString(36).substring(2, 6));
    const saved = serverRow || { ...rowData, id: fallbackId };
    updated = [saved, ...currentList.filter(r => r.id !== saved.id)];
  }
  setLocalItem('dd_' + table + '_list_v1', updated);
  return updated;
}

// 스마트 고유 순번 채번 함수 (YYYYMMDD-001, -002 ...)
function generateNextDocNo(targetDate, docList = []) {
  const d = targetDate ? new Date(targetDate) : new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  
  let maxSeq = 0;
  (docList || []).forEach(doc => {
    if (!doc || !doc.doc_no) return;
    const cleanNo = String(doc.doc_no).trim();
    if (cleanNo.startsWith(dateStr)) {
      const parts = cleanNo.split('-');
      if (parts.length >= 2) {
        const seq = parseInt(parts[1], 10);
        if (!isNaN(seq) && seq > maxSeq) {
          maxSeq = seq;
        }
      }
    }
  });

  return `${dateStr}-${String(maxSeq + 1).padStart(3, '0')}`;
}

// 과거 중복 문서번호 자동 정리 및 고유 순번 재부여 (1회성 마이그레이션)
async function deduplicateAndResequenceDocNumbers(docList = []) {
  if (!docList || docList.length === 0) return docList;
  
  const dateGroups = new Map();
  docList.forEach(doc => {
    const rawDate = doc.doc_date || (doc.created_at ? doc.created_at.split('T')[0] : '') || new Date().toISOString().split('T')[0];
    const d = new Date(rawDate);
    const dateKey = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    if (!dateGroups.has(dateKey)) dateGroups.set(dateKey, []);
    dateGroups.get(dateKey).push(doc);
  });

  let hasChange = false;
  const updatedList = [];

  dateGroups.forEach((docs, dateKey) => {
    // 생성일시 및 시간 기준 정렬 (오래된 것부터 001, 002...)
    docs.sort((a, b) => {
      const timeA = (a.doc_date || '') + ' ' + (a.doc_time || a.created_at || '');
      const timeB = (b.doc_date || '') + ' ' + (b.doc_time || b.created_at || '');
      return timeA.localeCompare(timeB);
    });

    const usedSeqs = new Set();
    docs.forEach((doc, idx) => {
      let currentSeq = null;
      if (doc.doc_no && doc.doc_no.startsWith(dateKey)) {
        const parts = doc.doc_no.split('-');
        if (parts.length >= 2) {
          const num = parseInt(parts[1], 10);
          if (!isNaN(num) && !usedSeqs.has(num)) {
            currentSeq = num;
          }
        }
      }
      
      if (currentSeq === null) {
        // 다음 빈 순번 탐색
        let nextSeq = 1;
        while (usedSeqs.has(nextSeq)) nextSeq++;
        currentSeq = nextSeq;
        hasChange = true;
      }
      
      usedSeqs.add(currentSeq);
      const uniqueDocNo = `${dateKey}-${String(currentSeq).padStart(3, '0')}`;
      if (doc.doc_no !== uniqueDocNo) {
        doc.doc_no = uniqueDocNo;
        hasChange = true;
      }
      updatedList.push(doc);
    });
  });

  if (hasChange) {
    setLocalItem('dd_documents_history_v1', updatedList);
    // Supabase 동기화
    const sb = getSupabaseClient();
    if (sb) {
      try {
        for (const d of updatedList) {
          if (d.id && !String(d.id).startsWith('doc_')) {
            await sb.from('documents').update({ doc_no: d.doc_no }).eq('id', d.id);
          }
        }
      } catch (e) { console.error('Error syncing resequenced doc numbers:', e); }
    }
  }

  return updatedList;
}

async function dbSaveDocument(docData) {

  const selectedSupplierKey = sessionStorage.getItem('selected_supplier_key') || localStorage.getItem('selected_supplier_key') || 'sejin';
  const local = getLocalItem('dd_documents_history_v1', []);

  // 공급자별 권한 체크 및 바인딩
  if (userRole === 'supplier') {
    if (docData.id) {
      const found = local.find(d => d.id === docData.id);
      if (found && found.supplier_key && !areSupplierKeysEquivalent(found.supplier_key, selectedSupplierKey)) {
        alert('해당 문서를 수정할 권한이 없습니다.');
        return local;
      }
    }
    docData.supplierKey = selectedSupplierKey;
  }

  let finalDocNo = (docData.docNo || '').trim();
  const isEditing = !!docData.id;

  // 신규 저장 시 문서번호 중복 방지 안전 가드
  if (!isEditing) {
    const isDuplicate = local.some(d => d.doc_no === finalDocNo && !d.is_deleted);
    if (!finalDocNo || isDuplicate) {
      finalDocNo = generateNextDocNo(docData.docDate, local);
    }
  }

  const docId = docData.id || 'doc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
  
  // 기존 리비전 조회
  let currentRevision = 0;
  if (isEditing) {
    const prevDoc = local.find(d => d.id === docId);
    if (prevDoc) currentRevision = (prevDoc.revision || 0) + 1;
  }

  const rawPayload = {
    doc_type: docData.docType,
    doc_no: finalDocNo,
    doc_date: docData.docDate,
    doc_time: docData.docTime,
    customer_name: (docData.customer == null ? undefined : docData.customer.name) || '',
    customer_data: docData.customer || {},
    supplier_key: docData.supplierKey || '',
    supplier_data: docData.supplier || {},
    items: docData.items || [],
    vat: docData.vat || 0,
    vat_included: docData.vatIncluded !== false,

function ScheduleTab({
  schedules = [],
  documentsList = [],
  selectedSupplierKey = 'sejin',
  suppliersList = [],
  onSaveSchedule,
  onDeleteSchedule,
  onLoadDocument
}) {
  const useState = React.useState;
  const useMemo = React.useMemo;
  const currentDate = new Date();
  const todayStr = currentDate.toISOString().split('T')[0];

  const [currentYear, setCurrentYear] = useState(currentDate.getFullYear());
  const [currentMonth, setCurrentMonth] = useState(currentDate.getMonth() + 1);
  const [selectedDate, setSelectedDate] = useState(todayStr); // 🌟 기본 선택을 오늘 날짜로 지정하여 하단에 바로 표시
  const [showEventModal, setShowEventModal] = useState(false);
  const [editingEvent, setEditingEvent] = useState(null);

  // 🔒 보안/공개 범위 필터: 기본은 'all'
  const [privacyFilter, setPrivacyFilter] = useState('all');
  const [categoryFilter, setCategoryFilter] = useState({
    schedule: true,
    repair_doc: true,
    payment: true,
    estimate: true
  });
  const [searchQuery, setSearchQuery] = useState('');

  // 🔒 일정 등록 폼: 기본값은 비공개(is_shared: false)
  const [form, setForm] = useState({
    title: '',
    event_date: todayStr,
    event_time: '10:00',
    category: 'repair',
    customer_name: '',
    customer_phone: '',
    machine_info: '',
    amount: '',
    memo: '',
    is_shared: false
  });

  const firstDayOfMonth = new Date(currentYear, currentMonth - 1, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const prevMonthDays = new Date(currentYear, currentMonth - 1, 0).getDate();

  const handlePrevMonth = () => {
    if (currentMonth === 1) { setCurrentYear(prev => prev - 1); setCurrentMonth(12); }
    else { setCurrentMonth(prev => prev - 1); }
  };

  const handleNextMonth = () => {
    if (currentMonth === 12) { setCurrentYear(prev => prev + 1); setCurrentMonth(1); }
    else { setCurrentMonth(prev => prev + 1); }
  };

  const handleToday = () => {
    const now = new Date();
    setCurrentYear(now.getFullYear());
    setCurrentMonth(now.getMonth() + 1);
    setSelectedDate(todayStr);
  };

  // 1. 보안 필터링 적용된 등록 일정 목록
  const filteredSchedules = useMemo(() => {
    return (schedules || []).filter(item => {
      const isMine = areSupplierKeysEquivalent(item.supplier_key, selectedSupplierKey);
      const isPublic = item.is_shared === true;
      if (!isMine && !isPublic) return false;

      if (privacyFilter === 'private' && (!isMine || isPublic)) return false;
      if (privacyFilter === 'my_public' && (!isMine || !isPublic)) return false;
      if (privacyFilter === 'others_public' && (isMine || !isPublic)) return false;

      if (!categoryFilter.schedule) return false;

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        const t = (item.title || '').toLowerCase();
        const c = (item.customer_name || '').toLowerCase();
        const m = (item.machine_info || '').toLowerCase();
        const memo = (item.memo || '').toLowerCase();
        if (!t.includes(q) && !c.includes(q) && !m.includes(q) && !memo.includes(q)) return false;
      }
      return true;
    });
  }, [schedules, selectedSupplierKey, privacyFilter, categoryFilter, searchQuery]);

  // 2. 보안 필터링 적용된 문서(명세서/결제일/견적서) 연동 일정
  const documentEvents = useMemo(() => {
    const events = [];
    (documentsList || []).forEach(doc => {
      if (doc.is_deleted) return;
      const isMine = areSupplierKeysEquivalent(doc.supplier_key, selectedSupplierKey);
      const isDocPublic = doc.is_shared === true;
      if (!isMine && !isDocPublic) return;

      const custName = doc.customer_name || doc.customer_data?.name || '고객';
      const machine = doc.customer_data?.selectedMachine || '';
      const itemsSum = (doc.items || []).map(i => i.name).filter(Boolean).join(', ');

      if (categoryFilter.repair_doc && doc.doc_date && (doc.doc_type === '거래명세서' || doc.doc_type === '청구서')) {
        events.push({
          id: 'doc_repair_' + doc.id,
          isDocEvent: true,
          rawDoc: doc,
          type: 'repair_doc',
          event_date: doc.doc_date,
          event_time: doc.doc_time || '',
          title: '📦 [' + doc.doc_type + '] ' + custName,
          subtitle: machine ? '(' + machine + ') ' + itemsSum : itemsSum,
          supplier_key: doc.supplier_key,
          is_shared: isDocPublic,
          isMine: isMine

function downloadDesktopShortcut() {
  const currentUrl = window.location.origin + window.location.pathname;
  const shortcutContent = `[InternetShortcut]\r\nURL=${currentUrl}\r\nIconIndex=0\r\nIconFile=${currentUrl}favicon.ico\r\n`;
  const blob = new Blob([shortcutContent], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'TEAM_DD_관리프로그램.url';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
