<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEAM D.D - 거래명세서 작성 및 고객/공급자/부품 관리</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/teamdd/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TEAM D.D">
  <link rel="apple-touch-icon" href="/teamdd/icon-512.jpg">
  <meta name="theme-color" content="#1d4ed8">
  <!-- Pretendard & Inter Web Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN (jsDelivr Global Network) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

  <style>
    /* Mobile-first responsive styling for Team D.D System */
    :root {
      --font-main: 'Pretendard', 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-app: #f3f4f6;
      --bg-card: #ffffff;
      --bg-muted: #f9fafb;
      --border-color: #e5e7eb;
      --primary: #111827;
      --primary-hover: #1f2937;
      --accent-green: #16a34a;
      --accent-green-bg: #ecfdf5;
      --accent-green-border: #a7f3d0;
      --accent-red: #dc2626;
      --accent-red-bg: #fef2f2;
      --accent-red-border: #fecaca;
      --text-main: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      min-height: 100vh;
      font-family: var(--font-main);
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 0.5rem;
      background-color: var(--bg-app);
    }

    @media (min-width: 640px) {
      .top-header {
        padding: 0.75rem 1rem;
      }
    }

    .header-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 0.625rem 0.875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand-title {
      font-size: 0.9375rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 0.6875rem;
      color: var(--text-muted);
      display: none;
    }

    @media (min-width: 640px) {
      .brand-sub {
        display: inline;
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.375rem 0.625rem;
      border-radius: 9999px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      z-index: 50;
    }

    .status-badge.connected {
      background-color: var(--accent-green-bg);
      color: #065f46;
      border-color: var(--accent-green-border);
    }

    .status-badge.disconnected {
      background-color: var(--accent-red-bg);
      color: #991b1b;
      border-color: var(--accent-red-border);
    }

    .tab-bar-container {
      margin-top: 0.375rem;
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: 0.25rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .tab-nav {
      display: flex;
      gap: 0.25rem;
      background-color: #f3f4f6;
      padding: 0.25rem;
      border-radius: var(--radius-sm);
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    @media (min-width: 640px) {
      .tab-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
      }
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: var(--primary);
      font-weight: 800;
      box-shadow: var(--shadow-sm);
    }

    .main-content {
      flex: 1;
      display: flex;
      width: 100%;
    }

    .generator-split {
      display: flex;
      width: 100%;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .generator-split {
        flex-direction: row;
      }
    }

    .form-panel {
      width: 100%;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      padding: 0.875rem;
    }

    @media (min-width: 640px) {
      .form-panel {
        padding: 1.25rem;
      }
    }

    @media (min-width: 1024px) {
      .form-panel {
        width: 380px;
        flex-shrink: 0;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
      }
    }

    .preview-panel {
      flex: 1;
      padding: 0.5rem;
      background-color: #eef0f3;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 500px;
    }

    @media (min-width: 640px) {
      .preview-panel {
        padding: 1.25rem;
      }
    }

    .form-section {
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 0.8125rem;
      font-weight: 700;
      margin-bottom: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--primary);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .form-label {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-family: inherit;
      background-color: #ffffff;
      outline: none;
      min-height: 40px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.375rem;
    }

    .btn {
      padding: 0.625rem 0.875rem;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      min-height: 42px;
      touch-action: manipulation;
    }

    .btn-primary { background-color: var(--primary); color: #ffffff; }
    .btn-outline { background-color: #ffffff; border-color: #d1d5db; color: var(--text-main); }
    .btn-green { background-color: var(--accent-green); color: #ffffff; }
    .btn-red-outline { background-color: #fef2f2; border-color: #fecaca; color: #dc2626; }

    .item-card {
      background-color: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.625rem;
      margin-bottom: 0.5rem;
    }

    .item-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.375rem;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 65px 1fr 1fr;
      gap: 0.375rem;
    }

    /* Mobile Scaled A4 Preview Box */
    .document-page-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      margin-bottom: 1.5rem;
      max-width: 100%;
      overflow-x: auto;
    }

    .document-page {
      width: 800px;
      min-height: 1131px;
      padding: 40px;
      background-color: #ffffff;
      color: #000000;
      box-sizing: border-box;
      position: relative;
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .doc-title-main {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 6px;
      padding: 8px 0;
      border-bottom: 2px solid #000000;
      margin-bottom: 12px;
    }

    .doc-info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .parties-table, .items-table, .doc-totals-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .parties-table th, .parties-table td,
    .items-table th, .items-table td,
    .doc-totals-table td {
      border: 1px solid #000000;
      padding: 5px 8px;
      font-size: 11px;
    }

    .parties-table th, .items-table th {
      background-color: #f3f4f6;
      font-weight: 700;
      text-align: center;
    }

    .stamp-box {
      position: absolute;
      right: 50px;
      bottom: 120px;
      width: 70px;
      height: 70px;
      border: 2px solid #dc2626;
      border-radius: 50%;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      transform: rotate(-12deg);
      opacity: 0.85;
    }

    .management-container {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem;
      width: 100%;
    }

    @media (min-width: 640px) {
      .management-container {
        padding: 1.25rem;
      }
    }

    .card-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-box-header {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (min-width: 640px) {
      .card-box-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    /* Mobile Cards vs Desktop Table */
    .mobile-cards-view {
      display: block;
      padding: 0.75rem;
    }

    .desktop-table-view {
      display: none;
    }

    @media (min-width: 768px) {
      .mobile-cards-view { display: none; }
      .desktop-table-view { display: block; }
    }

    .mobile-data-card {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.875rem;
      margin-bottom: 0.625rem;
      box-shadow: var(--shadow-sm);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    .data-table th {
      background-color: var(--bg-muted);
      color: var(--text-secondary);
      font-size: 0.6875rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.625rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid #f3f4f6;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }

    .modal-content {
      background-color: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1rem;
    }

    @page {
      size: A4 portrait;
      margin: 0mm;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #ffffff !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .top-header, .tab-bar-container, .form-panel, .modal-overlay, button, .status-badge {
        display: none !important;
      }
      .preview-panel {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        overflow: visible !important;
        display: block !important;
        width: 210mm !important;
      }
      .document-page-wrapper {
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        transform: none !important;
        page-break-after: always;
        page-break-inside: avoid;
      }
      .document-page {
        width: 210mm !important;
        min-height: 297mm !important;
        height: 297mm !important;
        padding: 10mm 12mm !important;
        box-sizing: border-box !important;
        transform: none !important;
        box-shadow: none !important;
        border: none !important;
        page-break-after: always;
        page-break-inside: avoid;
      }
    }



    /* ── Accounting / Payment Status Badges ── */
    .pay-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 20px;
      font-size: 10.5px; font-weight: 800; white-space: nowrap;
    }
    .pay-badge.unpaid   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .pay-badge.partial  { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .pay-badge.paid     { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .accounting-summary-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px; padding: 0.875rem 1rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      border-radius: 10px; margin: 0.75rem 1rem;
    }
    .accounting-summary-item { text-align: center; }
    .accounting-summary-label { font-size: 10px; color: rgba(255,255,255,0.55); font-weight: 600; margin-bottom: 2px; }
    .accounting-summary-value { font-size: 1rem; font-weight: 900; color: #fff; font-family: monospace; }
    .accounting-summary-value.unpaid-val { color: #f87171; }
    .accounting-summary-value.paid-val { color: #4ade80; }
    .payment-section {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 0.875rem; margin-top: 0.75rem;
    }
    .payment-status-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .pay-status-btn {
      padding: 5px 12px; border-radius: 20px; border: 1.5px solid;
      font-size: 0.8125rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s ease; background: transparent;
    }
    .pay-status-btn.active-unpaid   { background: #fef2f2; color: #dc2626; border-color: #dc2626; }
    .pay-status-btn.active-partial  { background: #fffbeb; color: #d97706; border-color: #d97706; }
    .pay-status-btn.active-paid     { background: #f0fdf4; color: #16a34a; border-color: #16a34a; }
    .pay-status-btn.inactive { color: #94a3b8; border-color: #e2e8f0; }
    .pay-status-btn.inactive:hover { border-color: #94a3b8; color: #475569; }

    /* ── Install / Add to Home Screen Button ── */
    .splash-install-btn {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 1.5rem; padding: 0.75rem 1.5rem;
      background: rgba(250, 204, 21, 0.15);
      border: 1.5px solid rgba(250, 204, 21, 0.5);
      border-radius: 50px; cursor: pointer;
      color: #fde68a; font-size: 0.875rem; font-weight: 700;
      transition: all 0.22s ease; font-family: var(--font-main, sans-serif);
    }
    .splash-install-btn:hover {
      background: rgba(250, 204, 21, 0.25);
      border-color: rgba(250, 204, 21, 0.8);
      transform: translateY(-1px);
    }
    .splash-install-ios-guide {
      margin-top: 1.25rem; padding: 0.875rem 1.25rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; max-width: 320px;
      text-align: center; font-size: 0.75rem;
      color: rgba(255,255,255,0.65); line-height: 1.6;
    }
    .splash-install-ios-guide b { color: #fde68a; }

    /* ── Splash / Login Screen ── */
    .splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 45%, #1d4ed8 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: var(--font-main, 'Pretendard', sans-serif);
      animation: splashFadeIn 0.6s ease;
    }
    @keyframes splashFadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .splash-logo-wrap {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 3rem;
    }
    .splash-icon {
      width: 72px; height: 72px; background: rgba(255,255,255,0.12);
      border-radius: 20px; display: flex; align-items: center;
      justify-content: center; margin-bottom: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .splash-title {
      font-size: 3rem; font-weight: 900; color: #ffffff;
      letter-spacing: -0.02em; line-height: 1;
    }
    .splash-title span { color: #60a5fa; }
    .splash-subtitle {
      font-size: 0.875rem; color: rgba(255,255,255,0.55);
      margin-top: 0.5rem; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .splash-label {
      font-size: 0.8125rem; font-weight: 600; color: rgba(255,255,255,0.6);
      text-align: center; margin-bottom: 1rem; letter-spacing: 0.04em;
    }
    .splash-cards {
      display: flex; flex-direction: column; gap: 0.875rem;
      width: 100%; max-width: 340px; padding: 0 1.25rem;
    }
    .splash-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 1.125rem 1.25rem;
      cursor: pointer; transition: all 0.22s ease;
      display: flex; align-items: center; gap: 1rem;
      backdrop-filter: blur(8px);
    }
    .splash-card:hover, .splash-card:active {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.35);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    .splash-card-avatar {
      width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.375rem; flex-shrink: 0;
    }
    .splash-card-info { flex: 1; }
    .splash-card-name {
      font-size: 1rem; font-weight: 800; color: #ffffff; line-height: 1.3;
    }
    .splash-card-sub {
      font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 2px;
    }
    .splash-card-arrow { color: rgba(255,255,255,0.35); font-size: 1.125rem; }
    .splash-footer {
      margin-top: 2.5rem; font-size: 0.6875rem;
      color: rgba(255,255,255,0.3); text-align: center;
    }
  
    .view-value {
      padding: 0.5rem;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      color: #334155;
      font-size: 0.875rem;
      min-height: 38px;
      display: flex;
      align-items: center;
    }
</style>

function packRow(r, table) {
  if (table !== 'customers' && table !== 'suppliers' && table !== 'documents') return { ...r };
  let standardCols = [];
  if (table === 'customers') {
    standardCols = ['id', 'created_at', 'code', 'name', 'bizno', 'person', 'phone', 'addr', 'machine', 'memo'];
  } else if (table === 'suppliers') {
    standardCols = ['id', 'created_at', 'code', 'name', 'bizno', 'person', 'phone', 'tel', 'bank', 'addr', 'memo'];
  } else if (table === 'documents') {
    standardCols = ['id', 'created_at', 'doc_type', 'doc_no', 'doc_date', 'doc_time', 'customer_name', 'customer_data', 'supplier_key', 'supplier_data', 'items', 'vat', 'vat_included', 'paid', 'remark'];
  }
  const payload = { ...r };
  const extraFields = {};
  for (const key of Object.keys(payload)) {
    if (!standardCols.includes(key)) {
      extraFields[key] = payload[key];
      delete payload[key];
    }
  }
  if (Object.keys(extraFields).length > 0) {
    if (table === 'documents') {
      payload.remark = (payload.remark || '') + '\n---EXT---\n' + JSON.stringify(extraFields);
    } else {
      payload.memo = (payload.memo || '') + '\n---EXT---\n' + JSON.stringify(extraFields);
    }
  }
  return payload;
}

function unpackRow(r) {
  if (!r) return r;
  if (r.memo && r.memo.includes('\n---EXT---\n')) {
    const parts = r.memo.split('\n---EXT---\n');
    r.memo = parts[0];
    try { Object.assign(r, JSON.parse(parts[1])); } catch(e) {}
  }
  if (r.remark && r.remark.includes('\n---EXT---\n')) {
    const parts = r.remark.split('\n---EXT---\n');
    r.remark = parts[0];
    try { Object.assign(r, JSON.parse(parts[1])); } catch(e) {}
  }
  return r;
}

async function dbFetch(table, fallback, orderCol = 'code') {
  const sb = getSupabaseClient();
  if (sb) {
    try {
      const {
        data,
        error
      } = await sb.from(table).select('*').order(orderCol, {
        ascending: true
      });
      if (!error && Array.isArray(data) && data.length > 0) {
        const unpacked = data.map(unpackRow);
        setLocalItem('dd_' + table + '_list_v1', unpacked);
        return unpacked;
      }
    } catch (e) { console.error(e); }
  }
  return getLocalItem('dd_' + table + '_list_v1', fallback).map(unpackRow);
}

async function dbSave(table, rowData, isEdit = false, currentList = []) {
  const sb = getSupabaseClient();
  let serverRow = null;
  if (sb) {
    try {
      const packedData = packRow(rowData, table);
      if (isEdit && rowData.id) {
        const { id, created_at, ...payload } = packedData;
        const { data, error } = await sb.from(table).update(payload).eq('id', id).select().single();
        if (!error) serverRow = unpackRow(data);
        else { console.error('Supabase update error:', error); alert('Supabase update error: ' + (error.message || JSON.stringify(error))); }
      } else {
        const { id, created_at, ...payload } = packedData;
        const { data, error } = await sb.from(table).insert(payload).select().single();
        if (!error) serverRow = unpackRow(data);
        else { console.error('Supabase insert error:', error); alert('Supabase insert error: ' + (error.message || JSON.stringify(error))); }
      }
    } catch (e) { console.error(e); }
  }
  let updated;
  if (isEdit && rowData.id) {
    updated = currentList.map(r => r.id === rowData.id ? { ...r, ...(serverRow || rowData) } : r);
  } else {
    const fallbackId = isEdit && rowData.id ? rowData.id : (table + '_' + Date.now() + Math.random().toString(36).substring(2, 6));
    const saved = serverRow || { ...rowData, id: fallbackId };
    updated = [saved, ...currentList.filter(r => r.id !== saved.id)];
  }
  setLocalItem('dd_' + table + '_list_v1', updated);
  return updated;
}
