    const getLocalItem = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) { return fallback; }
    };

    const setLocalItem = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    };

    // ── Supabase Client ────────────────────────────────────────────────────────
    let _sbClient = null;
    let _sbUrl = '';
    let _sbKey = '';

    function getSupabaseClient() {
      const url = (localStorage.getItem('supabase_url') || '').trim();
      const key = (localStorage.getItem('supabase_anon_key') || '').trim();
      if (!url || !key) return null;
      if (_sbClient && url === _sbUrl && key === _sbKey) return _sbClient;
      try {
        _sbClient = window.supabase.createClient(url, key, {
          auth: { persistSession: false, autoRefreshToken: false }
        });
        _sbUrl = url;
        _sbKey = key;
        return _sbClient;
      } catch(e) { return null; }
    }

    async function sbTestConnection(url, key) {
      if (!url || !key) return { ok: false, message: 'URL과 Anon Key를 입력해 주세요.' };
      try {
        const client = window.supabase.createClient(url.trim(), key.trim(), { auth: { persistSession: false } });
        const { error } = await client.from('customers').select('id').limit(1);
        if (error) {
          if (error.code === '42P01' || (error.message && error.message.includes('does not exist'))) {
            return { ok: true, isTableMissing: true, message: '✓ Supabase 연결 성공! (테이블 미생성 - 아래 SQL 복사 후 SQL Editor에서 실행하세요)' };
          }
          return { ok: false, message: '연결 오류: ' + error.message };
        }
        return { ok: true, isTableMissing: false, message: '✓ Supabase 클라우드 DB 연결 성공!' };
      } catch(e) {
        return { ok: false, message: '연결 실패: ' + e.message };
      }
    }

    // ── DB CRUD helpers ────────────────────────────────────────────────────────
    async function dbFetch(table, fallback, orderCol = 'code') {
      const sb = getSupabaseClient();
      if (sb) {
        try {
          const { data, error } = await sb.from(table).select('*').order(orderCol, { ascending: true });
          if (!error && Array.isArray(data) && data.length > 0) {
            setLocalItem('dd_' + table + '_list_v1', data);
            return data;
          }
        } catch(e) { /* fallback */ }
      }
      return getLocalItem('dd_' + table + '_list_v1', fallback);
    }

    async function dbSave(table, rowData, isEdit = false, currentList = []) {
      const sb = getSupabaseClient();
      let serverRow = null;
      if (sb) {
        try {
          if (isEdit && rowData.id) {
            const { id, created_at, ...payload } = rowData;
            const { data, error } = await sb.from(table).update(payload).eq('id', id).select().single();
            if (!error) serverRow = data;
          } else {
            const { id, ...payload } = rowData;
            const { data, error } = await sb.from(table).insert(payload).select().single();
            if (!error) serverRow = data;
          }
        } catch(e) { /* fallback */ }
      }
      
      let updated;
      if (isEdit && rowData.id) {
        updated = currentList.map(r => r.id === rowData.id ? { ...r, ...(serverRow || rowData) } : r);
      } else {
        const saved = serverRow || { ...rowData, id: table + '_' + Date.now() };
        updated = [saved, ...currentList.filter(r => r.id !== saved.id)];
      }
      setLocalItem('dd_' + table + '_list_v1', updated);
      return updated;
    }

    async function dbDelete(table, rowId, currentList = []) {
      const sb = getSupabaseClient();
      if (sb) {
        try { await sb.from(table).delete().eq('id', rowId); } catch(e) {}
      }
      const updated = currentList.filter(r => r.id !== rowId);
      setLocalItem('dd_' + table + '_list_v1', updated);
      return updated;
    }

    async function dbSaveDocument(docData) {
      const sb = getSupabaseClient();
      const docId = docData.id || ('doc_' + Date.now());
      const payload = {
        doc_type: docData.docType,
        doc_no: docData.docNo,
        doc_date: docData.docDate,
        doc_time: docData.docTime,
        customer_name: docData.customer?.name || '',
        customer_data: docData.customer || {},
        supplier_key: docData.supplierKey || '',
        supplier_data: docData.supplier || {},
        items: docData.items || [],
        vat: docData.vat || 0,
        vat_included: docData.vatIncluded !== false,
        paid: docData.paid || 0,
        remark: docData.remark || ''
      };

      if (sb) {
        try {
          if (docData.id && !String(docData.id).startsWith('doc_')) {
            await sb.from('documents').update(payload).eq('id', docData.id);
          } else {
            await sb.from('documents').insert(payload);
          }
        } catch(e) {}
      }

      const local = getLocalItem('dd_documents_history_v1', []);
      const existingIdx = local.findIndex(d => d.id === docId || (d.doc_no === docData.docNo && d.doc_date === docData.docDate));
      let updated;
      if (existingIdx >= 0) {
        updated = [...local];
        updated[existingIdx] = { ...payload, id: local[existingIdx].id, updated_at: new Date().toISOString() };
      } else {
        updated = [{ ...payload, id: docId, created_at: new Date().toISOString() }, ...local];
      }
      setLocalItem('dd_documents_history_v1', updated);
      return updated;
    }

    async function dbFetchDocuments() {
      const sb = getSupabaseClient();
      let list = [];
      if (sb) {
        try {
          const { data, error } = await sb.from('documents').select('*').order('created_at', { ascending: false });
          if (!error && data && data.length > 0) list = data;
        } catch(e) {}
      }
      if (list.length === 0) {
        list = getLocalItem('dd_documents_history_v1', []);
      }
      return list;
    }

    async function dbDeleteDocument(docId) {
      const sb = getSupabaseClient();
      if (sb && docId && !String(docId).startsWith('doc_')) {
        try { await sb.from('documents').delete().eq('id', docId); } catch(e) {}
      }
      const local = getLocalItem('dd_documents_history_v1', []);
      const updated = local.filter(d => d.id !== docId && d.doc_no !== docId);
      setLocalItem('dd_documents_history_v1', updated);
      return updated;

    function StatementTab({ docType, setDocType, docNo, setDocNo, docDate, setDocDate, docTime, setDocTime, selectedSupplierKey, setSelectedSupplierKey, suppliersList, currentSupplier, setCurrentSupplier, customer, setCustomer, customersList, items, setItems, vat, setVat, vatIncluded, setVatIncluded, paid, setPaid, remark, setRemark, onResetForm, onSaveDocument, onAddNewCustomer, editingDocId }) {
      const [showAutocomplete, setShowAutocomplete] = useState(false);
      const matchingCustomers = (customer.name || '').trim() ? customersList.filter(c => (c.name || '').toLowerCase().includes((customer.name || '').toLowerCase())) : [];

      const handleExportPNG = async () => {
        const pages = document.querySelectorAll('.document-page');
        if (!pages || pages.length === 0) return;
        for (let i = 0; i < pages.length; i++) {
          const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff' });
          const link = document.createElement('a');
          link.download = `${docType}_${docNo || '명세서'}_${i + 1}페이지.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }
      };

      return (
        <div className="generator-split">
          <div className="form-panel">
            {editingDocId && (
              <div style={{ marginBottom: '0.75rem', padding: '0.625rem 0.875rem', backgroundColor: '#eff6ff', border: '1px solid #bfdbfe', borderRadius: '8px', color: '#1e40af', fontSize: '0.8125rem', fontWeight: '700', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span>✏️ 저장된 문서 [{docNo}] 수정 중입니다.</span>
                <button style={{ border: 'none', background: 'none', color: '#1d6bf3', textDecoration: 'underline', cursor: 'pointer', fontSize: '0.75rem' }} onClick={onResetForm}>신규 작성 전환</button>

            <div className="form-section">

                <div className="form-group">
                  <label className="form-label">문서 종류</label>
                  <select className="form-select" value={docType} onChange={e => setDocType(e.target.value)}>
                    {DOC_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">공급자 선택</label>
                  <select className="form-select" value={selectedSupplierKey} onChange={e => setSelectedSupplierKey(e.target.value)}>
                    {suppliersList.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}

              </div>

                <div className="form-group">
                  <label className="form-label">문서번호</label>

                  <input type="date" className="form-input" value={docDate} onChange={e => setDocDate(e.target.value)} />

              </div>
            </div>

            <div style={{ marginBottom: '1.25rem' }}>
              <button 
                type="button" 
                className="btn btn-primary" 
                style={{ width: '100%', minHeight: '44px', fontSize: '0.9375rem', fontWeight: '800', backgroundColor: '#1d6bf3', color: '#ffffff', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(29,107,243,0.25)', border: 'none', cursor: 'pointer' }} 
                onClick={onResetForm}
              >
                <span>✨ 신규 문서 작성</span>
              </button>
            </div>

            <div className="form-section">
              <div className="section-title">👥 공급받는자 (거래처)</div>
              <div className="form-group" style={{ position: 'relative' }}>
                <label className="form-label">거래처명 검색 / 입력</label>
                <input
                  type="text"
                  className="form-input"
                  placeholder="거래처 검색 (자동완성)"
                  value={customer.name || ''}
                  onChange={e => { setCustomer({ ...customer, name: e.target.value }); setShowAutocomplete(true); }}
                  onFocus={() => setShowAutocomplete(true)}
                />
                {showAutocomplete && matchingCustomers.length > 0 && (
                  <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, backgroundColor: '#ffffff', border: '1px solid #d1d5db', borderRadius: '8px', zIndex: 20 }}>
                    {matchingCustomers.map(c => (
                      <button key={c.id} style={{ width: '100%', textAlign: 'left', padding: '0.625rem', background: 'none', border: 'none', borderBottom: '1px solid #eee', cursor: 'pointer' }} onClick={() => { setCustomer({ name: c.name, person: c.person, phone: c.phone, addr: c.addr, selectedMachine: c.selectedMachine }); setShowAutocomplete(false); }}>
                        <div style={{ fontWeight: '700' }}>{c.name}</div>
                        <div style={{ fontSize: '10px', color: '#666' }}>{c.person} • {c.phone}</div>
                      </button>
                    ))}
                  </div>
                )}
                {showAutocomplete && matchingCustomers.length === 0 && (customer.name || '').trim() !== '' && (
                  <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, backgroundColor: '#ffffff', border: '1px solid #d1d5db', borderRadius: '8px', zIndex: 20, padding: '1rem', textAlign: 'center', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)' }}>
                    <div style={{ marginBottom: '0.5rem', color: '#4b5563', fontSize: '0.875rem' }}>"{customer.name}" 거래처가 없습니다.</div>
                    <button type="button" className="btn btn-primary" style={{ width: '100%' }} onClick={() => onAddNewCustomer(customer.name)}>+ 새 거래처 등록하기</button>
                  </div>
                )}
              </div>
              {customer.person || customer.phone || customer.addr ? (
                <div style={{ marginTop: '0.5rem', padding: '0.5rem', backgroundColor: '#f9fafb', borderRadius: '4px', fontSize: '0.875rem', color: '#4b5563' }}>
                  {customer.person && <div><strong>담당자:</strong> {customer.person}</div>}
                  {customer.phone && <div><strong>연락처:</strong> {customer.phone}</div>}
                  {customer.addr && <div><strong>주소:</strong> {customer.addr}</div>}
                </div>
              ) : null}
            </div>

            <div className="form-section">
              <div className="section-title">
                <span>📦 품목 리스트 ({items.length}건)</span>
                <button className="btn btn-outline" style={{ fontSize: '11px', padding: '4px 8px', minHeight: '32px' }} onClick={() => setItems([...items, { id: Date.now().toString(), code: '', name: '', unit: 'EA', qty: 1, price: 0 }])}>+ 행 추가</button>
              </div>
              {items.map((item, idx) => (
                <div key={item.id} className="item-card">
                  <div className="item-card-header">
                    <span style={{ fontSize: '11px', color: '#666' }}>#{idx + 1}</span>
                    <button style={{ border: 'none', background: 'none', color: '#dc2626', cursor: 'pointer', fontSize: '11px', padding: '4px' }} onClick={() => setItems(items.length === 1 ? [{ id: Date.now().toString(), code: '', name: '', unit: 'EA', qty: 1, price: 0 }] : items.filter(i => i.id !== item.id))}>삭제</button>
                  </div>
                  <input type="text" className="form-input" placeholder="품명 및 규격" value={item.name} onChange={e => setItems(items.map(i => i.id === item.id ? { ...i, name: e.target.value } : i))} style={{ marginBottom: '4px' }} />
                  <div className="item-grid">
                    <input type="text" className="form-input" placeholder="단위" value={item.unit} onChange={e => setItems(items.map(i => i.id === item.id ? { ...i, unit: e.target.value } : i))} />
                    <input type="number" className="form-input" placeholder="수량" value={item.qty} onChange={e => setItems(items.map(i => i.id === item.id ? { ...i, qty: Number(e.target.value) || 0 } : i))} />
                    <input type="number" className="form-input" placeholder="단가" value={item.price} onChange={e => setItems(items.map(i => i.id === item.id ? { ...i, price: Number(e.target.value) || 0 } : i))} />
                  </div>
                </div>
              ))}
            </div>

            <div className="form-section">
              <div className="section-title">📝 비고 / 특이사항</div>
              <div className="form-group">
                <textarea className="form-input" style={{ minHeight: '60px', resize: 'vertical' }} value={remark} onChange={e => setRemark(e.target.value)} placeholder="명세서 하단에 인쇄될 비고를 입력하세요" />
              </div>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem', marginTop: '1rem' }}>
              <div className="grid-2">
                <button className="btn btn-green" onClick={handleExportPNG}>📸 이미지 저장</button>
                <button className="btn btn-primary" onClick={() => window.print()}>🖨️ 인쇄 / PDF</button>
              </div>
              <button className="btn btn-outline" onClick={onSaveDocument}>💾 로컬/DB 저장</button>
            </div>
          </div>

          <div className="preview-panel">
            <DocumentCanvas docType={docType} docNo={docNo} docDate={docDate} docTime={docTime} supplier={currentSupplier} customer={customer} items={items} vat={vat} vatIncluded={vatIncluded} paid={paid} remark={remark} />
          </div>
        </div>
      );
    }

    function CustomerTab({ customers, onSaveCustomer, onDeleteCustomer, onSelectCustomer, openAddModal, setOpenAddModal }) {
      const [search, setSearch] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [isEditMode, setIsEditMode] = useState(false);
      const [form, setForm] = useState({ id: null, code: '', name: '', person: '', phone: '', addr: '', bizno: '', machine: '', memo: '' });
      const [machineInput, setMachineInput] = useState('');
      const [machineNoInput, setMachineNoInput] = useState('');
      const [machineList, setMachineList] = useState([]);
      const [selectMachineCustomer, setSelectMachineCustomer] = useState(null);

      const filtered = customers.filter(c => (c.name || '').toLowerCase().includes(search.toLowerCase()) || (c.phone || '').includes(search) || (c.person || '').includes(search) || (c.machine || '').toLowerCase().includes(search.toLowerCase()));

      const handleOpenAdd = () => {
        setIsEditMode(false);
        setForm({ id: null, code: `C${String(customers.length + 1).padStart(4, '0')}`, name: '', person: '', phone: '', addr: '', bizno: '', machine: '', memo: '' });
        setMachineList([]);
        setMachineInput('');
        setMachineNoInput('');
        setShowModal(true);
      };

      React.useEffect(() => {
        if (openAddModal) {
          setIsEditMode(false);
          setForm({ id: null, code: `C${String(customers.length + 1).padStart(4, '0')}`, name: '', person: '', phone: '', addr: '', bizno: '', machine: '', memo: '' });
          setMachineList([]);
          setMachineInput('');
          setMachineNoInput('');
          setShowModal(true);
          if (setOpenAddModal) setOpenAddModal(false);
        }
      }, [openAddModal, customers.length, setOpenAddModal]);

      const handleOpenEdit = (c) => {
        setIsEditMode(true);
        setForm({
          id: c.id,
          code: c.code || '',
          name: c.name || '',
          person: c.person || '',
          phone: c.phone || '',
          addr: c.addr || '',
          bizno: c.bizno || '',
          machine: c.machine || '',
          memo: c.memo || ''
        });
        setMachineList(c.machine ? c.machine.split(',').map(s => s.trim()).filter(s => s) : []);
        setMachineInput('');
        setMachineNoInput('');
        setShowModal(true);
      };

      const handleAddMachine = () => {
        if (!machineInput.trim() && !machineNoInput.trim()) return;
        let combined = machineInput.trim();
        if (machineNoInput.trim()) {
          combined = combined ? `${combined} / ${machineNoInput.trim()}` : machineNoInput.trim();
        }
        setMachineList([...machineList, combined]);
        setMachineInput('');
        setMachineNoInput('');
      };

      const handleRemoveMachine = (idx) => {
        setMachineList(machineList.filter((_, i) => i !== idx));
      };

      const handleSave = () => {
        if (!form.name) { alert('상호명은 필수입니다.'); return; }
        const finalMachine = machineList.join(',');
        onSaveCustomer({ ...form, machine: finalMachine }, isEditMode);
        setShowModal(false);
      };

      const renderMachineDisplay = (machineStr) => {
        if (!machineStr) return '-';
        const list = machineStr.split(',').map(s => s.trim()).filter(s => s);
        if (list.length === 0) return '-';
        if (list.length === 1) return <span style={{ fontWeight: 'bold' }}>{list[0]}</span>;
        return <span style={{ fontWeight: 'bold' }}>{list[0]} <span style={{ fontSize: '0.6875rem', color: '#3b82f6' }}>(외 {list.length - 1}대)</span></span>;
      };

      const handleSelectInvoice = (c) => {
        const list = c.machine ? c.machine.split(',').map(s => s.trim()).filter(s => s) : [];
        if (list.length > 1) {
          setSelectMachineCustomer({ ...c, parsedMachines: list });
        } else {
          onSelectCustomer({ ...c, selectedMachine: list[0] || '' });
        }
      };

      return (
        <div className="management-container">
          <div className="card-box">
            <div className="card-box-header">
              <h2 style={{ fontSize: '1.125rem', fontWeight: '900' }}>👥 고객 (거래처) 관리</h2>
              <button className="btn btn-primary" onClick={handleOpenAdd}>+ 거래처 추가</button>
            </div>
            <div style={{ padding: '0.75rem', backgroundColor: '#f9fafb' }}>
              <input type="text" className="form-input" placeholder="상호명, 기종, 담당자, 연락처 검색..." value={search} onChange={e => setSearch(e.target.value)} />
            </div>

            {/* Mobile Cards View */}
            <div className="mobile-cards-view">
              {filtered.map(c => (
                <div key={c.id} className="mobile-data-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.375rem' }}>
                    <span style={{ fontWeight: '900', fontSize: '0.9375rem' }}>{c.name}</span>
                    <span style={{ fontSize: '0.6875rem', color: '#6b7280', fontFamily: 'monospace' }}>{c.code}</span>
                  </div>
                  <div style={{ fontSize: '0.75rem', color: '#4b5563', marginBottom: '0.5rem' }}>
                    <div>기종: {renderMachineDisplay(c.machine)}</div>
                    <div>담당자: {c.person || '-'}</div>
                    <div>연락처: {c.phone || '-'}</div>
                    <div style={{ textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>주소: {c.addr || '-'}</div>
                  </div>
                  <div style={{ display: 'flex', gap: '0.375rem', marginBottom: '0.375rem' }}>
                    <button className="btn btn-outline" style={{ flex: 1, minHeight: '32px', fontSize: '0.75rem' }} onClick={() => handleOpenEdit(c)}>상세 / 수정</button>
                    <button className="btn btn-red-outline" style={{ flex: 1, minHeight: '32px', fontSize: '0.75rem' }} onClick={() => onDeleteCustomer(c.id)}>삭제</button>
                  </div>
                  <button className="btn btn-primary" style={{ width: '100%', minHeight: '36px', fontSize: '0.75rem' }} onClick={() => handleSelectInvoice(c)}>명세서에 선택</button>
                </div>
              ))}
            </div>

            {/* Desktop Table View */}
            <div className="desktop-table-view">
              <table className="data-table">
                <thead>
                  <tr><th>Code</th><th>상호명</th><th>기종</th><th>담당자</th><th>연락처</th><th>주소</th><th>작업</th></tr>
                </thead>
                <tbody>
                  {filtered.map(c => (
                    <tr key={c.id}>
                      <td style={{ fontFamily: 'monospace' }}>{c.code}</td>
                      <td style={{ fontWeight: '700' }}>{c.name}</td>
                      <td>{renderMachineDisplay(c.machine)}</td>
                      <td>{c.person}</td>
                      <td>{c.phone}</td>
                      <td style={{ fontSize: '11px' }}>{c.addr}</td>
                      <td style={{ whiteSpace: 'nowrap' }}>
                        <div style={{ display: 'flex', gap: '4px' }}>
                          <button className="btn btn-primary" style={{ fontSize: '10px', padding: '4px 6px' }} onClick={() => handleSelectInvoice(c)}>명세서 선택</button>
                          <button className="btn btn-outline" style={{ fontSize: '10px', padding: '4px 6px' }} onClick={() => handleOpenEdit(c)}>수정</button>
                          <button className="btn btn-red-outline" style={{ fontSize: '10px', padding: '4px 6px' }} onClick={() => onDeleteCustomer(c.id)}>삭제</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {showModal && (

    function DocHistoryTab({ onLoadDocument, isConnected }) {
      const [documents, setDocuments] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchKeyword, setSearchKeyword] = useState('');
      const [docTypeFilter, setDocTypeFilter] = useState('전체');
      
      const [startDate, setStartDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
      });
      const [endDate, setEndDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      const loadDocs = async () => {
        setLoading(true);
        const data = await dbFetchDocuments();
        setDocuments(data || []);
        setLoading(false);
      };

      useEffect(() => {
        loadDocs();
      }, [isConnected]);

      const setPresetDate = (type) => {
        const today = new Date();
        const endStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        setEndDate(endStr);

        if (type === 'today') {
          setStartDate(endStr);
        } else if (type === 'month') {
          setStartDate(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-01`);
        } else if (type === 'last_month') {
          const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
          const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0);
          setStartDate(`${lastMonth.getFullYear()}-${String(lastMonth.getMonth() + 1).padStart(2, '0')}-01`);
          setEndDate(`${lastMonthEnd.getFullYear()}-${String(lastMonthEnd.getMonth() + 1).padStart(2, '0')}-${String(lastMonthEnd.getDate()).padStart(2, '0')}`);
        } else if (type === '3months') {
          const d3 = new Date(today.getFullYear(), today.getMonth() - 3, 1);
          setStartDate(`${d3.getFullYear()}-${String(d3.getMonth() + 1).padStart(2, '0')}-01`);
        } else if (type === 'all') {
          setStartDate('');
          setEndDate('');
        }
      };

      const filtered = documents.filter(doc => {
        const date = doc.doc_date || (doc.created_at ? doc.created_at.split('T')[0] : '');
        if (startDate && date < startDate) return false;
        if (endDate && date > endDate) return false;
        if (docTypeFilter !== '전체' && (doc.doc_type || doc.docType) !== docTypeFilter) return false;

        if (searchKeyword.trim()) {
          const kw = searchKeyword.toLowerCase();
          const custName = (doc.customer_name || doc.customer_data?.name || '').toLowerCase();
          const docNo = (doc.doc_no || '').toLowerCase();
          const itemsStr = JSON.stringify(doc.items || []).toLowerCase();
          if (!custName.includes(kw) && !docNo.includes(kw) && !itemsStr.includes(kw)) {
            return false;
          }
        }
        return true;
      });

      const handleDelete = async (doc) => {
        if (!confirm(`[${doc.doc_no || doc.doc_type}] 문서를 삭제하시겠습니까?`)) return;
        const updated = await dbDeleteDocument(doc.id);
        setDocuments(updated);
        alert('✓ 문서가 삭제되었습니다.');
      };

      const calculateTotal = (doc) => {
        const items = doc.items || [];
        const supply = items.reduce((sum, i) => sum + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
        const vat = doc.vat_included !== false ? Math.floor(supply * 0.1) : Number(doc.vat) || 0;
        return supply + vat;
      };

      const totalSumAmount = filtered.reduce((sum, d) => sum + calculateTotal(d), 0);

      return (
        <div className="management-container">
          <div className="card-box">
            <div className="card-box-header">
              <h2 style={{ fontSize: '1.125rem', fontWeight: '900' }}>📁 저장된 문서 기간별 조회 및 수정</h2>
              <button className="btn btn-outline" style={{ fontSize: '0.75rem' }} onClick={loadDocs}>🔄 새로고침</button>
            </div>

            {/* Filter Section */}
            <div style={{ padding: '1rem', backgroundColor: '#f8fafc', borderBottom: '1px solid #e2e8f0', display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
              <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '8px' }}>
                <span style={{ fontSize: '0.8125rem', fontWeight: '700', color: '#334155' }}>🗓️ 기간 검색:</span>
                <input type="date" className="form-input" style={{ width: 'auto', minWidth: '130px' }} value={startDate} onChange={e => setStartDate(e.target.value)} />
                <span style={{ color: '#64748b' }}>~</span>
                <input type="date" className="form-input" style={{ width: 'auto', minWidth: '130px' }} value={endDate} onChange={e => setEndDate(e.target.value)} />
                
                <div style={{ display: 'flex', gap: '4px', flexWrap: 'wrap' }}>
                  <button className="btn btn-outline" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={() => setPresetDate('today')}>오늘</button>
                  <button className="btn btn-outline" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={() => setPresetDate('month')}>이번달</button>
                  <button className="btn btn-outline" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={() => setPresetDate('last_month')}>지난달</button>
                  <button className="btn btn-outline" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={() => setPresetDate('3months')}>3개월</button>
                  <button className="btn btn-outline" style={{ padding: '2px 8px', fontSize: '11px' }} onClick={() => setPresetDate('all')}>전체</button>
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '8px' }}>
                <select className="form-select" value={docTypeFilter} onChange={e => setDocTypeFilter(e.target.value)}>
                  <option value="전체">모든 문서 종류</option>
                  {DOC_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <input type="text" className="form-input" placeholder="거래처명, 문서번호, 품목명 검색..." value={searchKeyword} onChange={e => setSearchKeyword(e.target.value)} />
              </div>
            </div>

            {/* Stats Summary Bar */}
            <div style={{ padding: '0.75rem 1rem', backgroundColor: '#eff6ff', borderBottom: '1px solid #bfdbfe', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.8125rem', color: '#1e3a8a', fontWeight: '700' }}>
              <div>📊 조회 결과: <span style={{ color: '#1d6bf3', fontWeight: '900' }}>{filtered.length}건</span></div>
              <div>💰 총 합계금액: <span style={{ color: '#1d6bf3', fontWeight: '900', fontFamily: 'monospace', fontSize: '0.9375rem' }}>{totalSumAmount.toLocaleString()}원</span></div>
            </div>

            {loading ? (
              <div style={{ padding: '2rem', textAlign: 'center', color: '#64748b' }}>문서를 불러오는 중입니다...</div>
            ) : filtered.length === 0 ? (
              <div style={{ padding: '2.5rem', textAlign: 'center', color: '#94a3b8' }}>
                <div>📭 해당 조건의 저장된 문서가 없습니다.</div>
                <div style={{ fontSize: '0.75rem', marginTop: '4px' }}>기간이나 검색어를 변경해 보세요.</div>
              </div>
            ) : (
              <>
                <div className="desktop-table-view">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>발행일자 / 번호</th>
                        <th>종류</th>
                        <th>공급받는자 (거래처)</th>
                        <th>품목 요약</th>
                        <th>합계금액</th>
                        <th>작업</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.map(doc => {
                        const items = doc.items || [];
                        const firstItemName = items[0]?.name || '품목 없음';
                        const itemSummary = items.length > 1 ? `${firstItemName} 외 ${items.length - 1}건` : firstItemName;
                        const total = calculateTotal(doc);
                        const custName = doc.customer_name || doc.customer_data?.name || '-';
                        const custMachine = doc.customer_data?.selectedMachine ? ` (${doc.customer_data.selectedMachine})` : '';

                        return (
                          <tr key={doc.id || doc.doc_no}>
                            <td>
                              <div style={{ fontWeight: '700' }}>{doc.doc_date || doc.created_at?.split('T')[0]}</div>
                              <div style={{ fontSize: '11px', color: '#64748b', fontFamily: 'monospace' }}>{doc.doc_no}</div>
                            </td>
                            <td>
                              <span style={{ padding: '2px 8px', borderRadius: '4px', backgroundColor: '#f1f5f9', color: '#334155', fontWeight: '700', fontSize: '11px' }}>{doc.doc_type || '거래명세서'}</span>
                            </td>
                            <td style={{ fontWeight: '700', color: '#0f172a' }}>
                              {custName}<span style={{ color: '#1d6bf3', fontSize: '11px' }}>{custMachine}</span>
                            </td>
                            <td style={{ fontSize: '12px', color: '#475569' }}>{itemSummary}</td>
                            <td style={{ fontWeight: '900', fontFamily: 'monospace', color: '#1d6bf3' }}>{total.toLocaleString()}원</td>
                            <td>
                              <div style={{ display: 'flex', gap: '4px' }}>
                                <button className="btn btn-primary" style={{ padding: '3px 8px', fontSize: '11px' }} onClick={() => onLoadDocument(doc)}>📥 불러오기/수정</button>
                                <button className="btn btn-red-outline" style={{ padding: '3px 8px', fontSize: '11px' }} onClick={() => handleDelete(doc)}>🗑️ 삭제</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                <div className="mobile-cards-view">
                  {filtered.map(doc => {
                    const items = doc.items || [];
                    const firstItemName = items[0]?.name || '품목 없음';
                    const itemSummary = items.length > 1 ? `${firstItemName} 외 ${items.length - 1}건` : firstItemName;
                    const total = calculateTotal(doc);
                    const custName = doc.customer_name || doc.customer_data?.name || '-';
                    const custMachine = doc.customer_data?.selectedMachine ? ` (${doc.customer_data.selectedMachine})` : '';

                    return (
                      <div key={doc.id || doc.doc_no} className="mobile-data-card">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                          <span style={{ padding: '2px 6px', borderRadius: '4px', backgroundColor: '#eff6ff', color: '#1d6bf3', fontWeight: '800', fontSize: '10px' }}>{doc.doc_type || '거래명세서'}</span>
                          <span style={{ fontSize: '11px', color: '#64748b', fontFamily: 'monospace' }}>{doc.doc_no}</span>
                        </div>
                        <div style={{ fontWeight: '800', fontSize: '0.9375rem', marginBottom: '2px' }}>
                          {custName}<span style={{ color: '#1d6bf3', fontSize: '11px' }}>{custMachine}</span>
                        </div>
                        <div style={{ fontSize: '0.75rem', color: '#64748b', marginBottom: '6px' }}>
                          <div>일자: {doc.doc_date || '-'} | 품목: {itemSummary}</div>
                          <div style={{ fontSize: '0.875rem', fontWeight: '900', color: '#1d6bf3', marginTop: '2px' }}>합계: {total.toLocaleString()}원</div>
                        </div>
                        <div style={{ display: 'flex', gap: '4px' }}>
                          <button className="btn btn-primary" style={{ flex: 1, minHeight: '32px', fontSize: '0.75rem' }} onClick={() => onLoadDocument(doc)}>📥 불러오기/수정</button>
                          <button className="btn btn-red-outline" style={{ flex: 1, minHeight: '32px', fontSize: '0.75rem' }} onClick={() => handleDelete(doc)}>🗑️ 삭제</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('doc');
      const [openAddCustomerModal, setOpenAddCustomerModal] = useState(false);
      const [editingDocId, setEditingDocId] = useState(null);

      // Supabase 연결 상태
      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('supabase_url') || 'https://wmrfwrsaacolkpjyrffy.supabase.co');
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('supabase_anon_key') || 'sb_publishable_nWgVPKLg5hHZqvCrOL9oUQ_GfuAGe9Y');
      const [isConnected, setIsConnected] = useState(false);
      const [isTesting, setIsTesting] = useState(false);
      const [connectionMessage, setConnectionMessage] = useState('');

      const [suppliersList, setSuppliersList] = useState(() => getLocalItem('dd_suppliers_list_v1', INITIAL_SUPPLIERS_LIST));
      const [selectedSupplierKey, setSelectedSupplierKey] = useState(() => localStorage.getItem('selected_supplier_key') || 'sejin');
      const [currentSupplier, setCurrentSupplier] = useState(DEFAULT_SUPPLIERS.sejin);

      const [customersList, setCustomersList] = useState(() => getLocalItem('dd_customers_list_v1', DEMO_CUSTOMERS));
      const [customer, setCustomer] = useState({ name: '', person: '', phone: '', addr: '' });

      const [partsList, setPartsList] = useState(() => getLocalItem('dd_parts_list_v1', DEMO_PARTS));

      const [docType, setDocType] = useState('거래명세서');
      const [items, setItems] = useState([
        { id: '1', code: 'P0001', name: '엔진오일 필터', unit: 'EA', qty: 2, price: 25000 },
        { id: '2', code: 'P0002', name: '유압유 20L', unit: 'CAN', qty: 1, price: 85000 }
      ]);
      const [vatIncluded, setVatIncluded] = useState(true);
      const [vat, setVat] = useState(0);
      const [paid, setPaid] = useState(0);
      const [remark, setRemark] = useState('');

      // 날짜/시간/문서번호 초기화
      const [docDate, setDocDate] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      });
      const [docTime, setDocTime] = useState(() => {
        const now = new Date();
        return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      });
      const [docNo, setDocNo] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-001`;
      });

      useEffect(() => {
        const found = suppliersList.find(s => s.id === selectedSupplierKey);
        if (found) {
          setCurrentSupplier({
            ...found,
            company: found.name || found.company,
            person: found.person || found.owner || '',
            tel: found.phone || found.tel,
            email: found.email || '',
            hasStamp: selectedSupplierKey === 'sejin'
          });
        } else if (DEFAULT_SUPPLIERS[selectedSupplierKey]) {
          const def = DEFAULT_SUPPLIERS[selectedSupplierKey];
          setCurrentSupplier({ ...def, person: def.person || def.name });
        }
        localStorage.setItem('selected_supplier_key', selectedSupplierKey);
      }, [selectedSupplierKey, suppliersList]);

      // Supabase 연결 테스트
      const handleTestConnection = async () => {
        setIsTesting(true);
        localStorage.setItem('supabase_url', supabaseUrl.trim());
        localStorage.setItem('supabase_anon_key', supabaseKey.trim());
        _sbClient = null; // 클라이언트 재생성 강제
        const result = await sbTestConnection(supabaseUrl, supabaseKey);
        setIsConnected(result.ok);
        setConnectionMessage(result.message);
        setIsTesting(false);
        if (result.ok && !result.isTableMissing) {
          // 모든 데이터 새로고침
          const [custs, supps, parts] = await Promise.all([
            dbFetch('customers', DEMO_CUSTOMERS),
            dbFetch('suppliers', INITIAL_SUPPLIERS_LIST),
            dbFetch('parts', DEMO_PARTS)
          ]);
          setCustomersList(custs);
          if (supps.length > 0) setSuppliersList(supps);
          if (parts.length > 0) setPartsList(parts);
        }
      };

      // 초기 자동 연결 시도
      useEffect(() => {
        if (supabaseUrl && supabaseKey) handleTestConnection();
      }, []);

      // 탭 전환 시 데이터 새로고침
      useEffect(() => {
        if (!isConnected) return;
        if (activeTab === 'customers') dbFetch('customers', DEMO_CUSTOMERS).then(setCustomersList);
        else if (activeTab === 'suppliers') dbFetch('suppliers', INITIAL_SUPPLIERS_LIST).then(d => { if(d.length>0) setSuppliersList(d); });
        else if (activeTab === 'parts') dbFetch('parts', DEMO_PARTS).then(d => { if(d.length>0) setPartsList(d); });
      }, [activeTab, isConnected]);

      // 고객 CRUD
      const handleSaveCustomer = async (c, isEdit) => {
        const updated = await dbSave('customers', c, isEdit, customersList);
        setCustomersList(updated);
        alert('✓ 거래처 정보가 저장되었습니다.');
      };
      const handleDeleteCustomer = async (id) => {
        if (!confirm('거래처를 삭제하시겠습니까?')) return;
        setCustomersList(await dbDelete('customers', id, customersList));
      };

      // 공급자 CRUD
      const handleSaveSupplier = async (s, isEdit) => {
        const updated = await dbSave('suppliers', s, isEdit, suppliersList);
        setSuppliersList(updated);
        alert('✓ 공급자 정보가 저장되었습니다.');
      };
      const handleDeleteSupplier = async (id) => {
        if (!confirm('공급자를 삭제하시겠습니까?')) return;
        setSuppliersList(await dbDelete('suppliers', id, suppliersList));
      };

      // 부품 CRUD
      const handleSavePart = async (p, isEdit) => {
        const updated = await dbSave('parts', p, isEdit, partsList);
        setPartsList(updated);
        alert('✓ 부품 정보가 저장되었습니다.');
      };
      const handleDeletePart = async (id) => {
        if (!confirm('부품을 삭제하시겠습니까?')) return;
        setPartsList(await dbDelete('parts', id, partsList));
      };

      // 문서 저장 및 수정
      const handleSaveDocument = async () => {
        await dbSaveDocument({
          id: editingDocId,
          docType, docNo, docDate, docTime, customer, supplier: currentSupplier, supplierKey: selectedSupplierKey, items, vat, vatIncluded, paid, remark
        });
        alert(`✓ ${docType} (번호: ${docNo}) 저장/수정 완료!`);
      };

      const handleLoadDocument = (doc) => {
        setDocType(doc.doc_type || doc.docType || '거래명세서');
        setDocNo(doc.doc_no || doc.docNo || '');
        setDocDate(doc.doc_date || doc.docDate || '');
        setDocTime(doc.doc_time || doc.docTime || '');
        if (doc.customer_data) setCustomer(doc.customer_data);
        else setCustomer({ name: doc.customer_name || '', person: '', phone: '', addr: '' });
        if (doc.supplier_key) setSelectedSupplierKey(doc.supplier_key);
        if (doc.items && Array.isArray(doc.items)) setItems(doc.items);
        setVatIncluded(doc.vat_included !== false);
        setVat(doc.vat || 0);
        setPaid(doc.paid || 0);
        setRemark(doc.remark || '');
        setEditingDocId(doc.id || null);
        setActiveTab('doc');
        alert(`✓ [${doc.doc_no || doc.doc_type}] 문서를 편집기로 불러왔습니다. 수정 후 저장해 보세요.`);
      };

      const handleResetForm = () => {
        const now = new Date();
        setDocNo(`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(Math.floor(Math.random()*100)).padStart(3,'0')}`);
        setCustomer({ name: '', person: '', phone: '', addr: '' });
        setItems([{ id: Date.now().toString(), code: '', name: '', unit: 'EA', qty: 1, price: 0 }]);
        setPaid(0); setRemark('');
        setEditingDocId(null);
      };

      return (
        <div className="app-container">
          <Header
            activeTab={activeTab} setActiveTab={setActiveTab}
            isConnected={isConnected} isTesting={isTesting}
            connectionMessage={connectionMessage}
            supabaseUrl={supabaseUrl} setSupabaseUrl={setSupabaseUrl}
            supabaseKey={supabaseKey} setSupabaseKey={setSupabaseKey}
            onTestConnection={handleTestConnection}
          />
          <main className="main-content">
            {activeTab === 'doc' && (
              <StatementTab
                docType={docType} setDocType={setDocType}
                docNo={docNo} setDocNo={setDocNo}
                docDate={docDate} setDocDate={setDocDate}
                docTime={docTime} setDocTime={setDocTime}
                selectedSupplierKey={selectedSupplierKey} setSelectedSupplierKey={setSelectedSupplierKey}
                suppliersList={suppliersList} currentSupplier={currentSupplier} setCurrentSupplier={setCurrentSupplier}
                customer={customer} setCustomer={setCustomer} customersList={customersList}
                items={items} setItems={setItems}
                vat={vat} setVat={setVat}
                vatIncluded={vatIncluded} setVatIncluded={setVatIncluded}
                paid={paid} setPaid={setPaid}
                remark={remark} setRemark={setRemark}
                onResetForm={handleResetForm}
                onSaveDocument={handleSaveDocument}
                onAddNewCustomer={(name) => {
                  setActiveTab('customers');
                  setOpenAddCustomerModal(true);
                }}
                editingDocId={editingDocId}
              />
            )}
            {activeTab === 'history' && (
              <DocHistoryTab
                onLoadDocument={handleLoadDocument}
                isConnected={isConnected}
              />
            )}
            {activeTab === 'customers' && (
              <CustomerTab
                customers={customersList}
                openAddModal={openAddCustomerModal}
                setOpenAddModal={setOpenAddCustomerModal}
                onSaveCustomer={handleSaveCustomer}
                onDeleteCustomer={handleDeleteCustomer}
                onSelectCustomer={(c) => { 
                  setCustomer(c); 
                  if (c.selectedMachine) {
                    setItems(prev => {
                      const newItems = [...prev];
                      if (!newItems[0].name) {
                        newItems[0].name = c.selectedMachine;
                      }
                      return newItems;
                    });
                    setRemark(prev => {
                      const prefix = `[기종: ${c.selectedMachine}] `;
                      return prev.includes(prefix) ? prev : prefix + prev;
                    });
                  }
                  setActiveTab('doc'); 
                }}
              />
            )}
            {activeTab === 'suppliers' && (
              <SupplierTab
                suppliers={suppliersList}
                onSaveSupplier={handleSaveSupplier}
                onDeleteSupplier={handleDeleteSupplier}
                onSelectSupplier={(s) => { setSelectedSupplierKey(s.id); setActiveTab('doc'); }}
              />
            )}
            {activeTab === 'parts' && (
              <PartsTab
                parts={partsList}
                onSavePart={handleSavePart}
                onDeletePart={handleDeletePart}
                onSelectPart={(p) => { setItems([...items, { id: Date.now().toString(), code: p.code, name: p.name, unit: p.unit || 'EA', qty: 1, price: p.price }]); setActiveTab('doc'); }}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
