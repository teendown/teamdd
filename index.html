    const PART_CATEGORIES = ["전체", "필터/오일", "유압부품", "전기부품", "엔진부품", "기타"];

    const getLocalItem = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) { return fallback; }
    };

    const setLocalItem = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    };

    // ── Supabase Client ────────────────────────────────────────────────────────
    let _sbClient = null;
    let _sbUrl = '';
    let _sbKey = '';

    function getSupabaseClient() {
      const url = (localStorage.getItem('supabase_url') || '').trim();
      const key = (localStorage.getItem('supabase_anon_key') || '').trim();
      if (!url || !key) return null;
      if (_sbClient && url === _sbUrl && key === _sbKey) return _sbClient;
      try {
        _sbClient = window.supabase.createClient(url, key, {
          auth: { persistSession: false, autoRefreshToken: false }
        });
        _sbUrl = url;
        _sbKey = key;
        return _sbClient;
      } catch(e) { return null; }
    }

    async function sbTestConnection(url, key) {
      if (!url || !key) return { ok: false, message: 'URL과 Anon Key를 입력해 주세요.' };
      try {
        const client = window.supabase.createClient(url.trim(), key.trim(), { auth: { persistSession: false } });
        const { error } = await client.from('customers').select('id').limit(1);
        if (error) {
          if (error.code === '42P01' || (error.message && error.message.includes('does not exist'))) {
            return { ok: true, isTableMissing: true, message: '✓ Supabase 연결 성공! (테이블 미생성 - 아래 SQL 복사 후 SQL Editor에서 실행하세요)' };
          }
          return { ok: false, message: '연결 오류: ' + error.message };
        }
        return { ok: true, isTableMissing: false, message: '✓ Supabase 클라우드 DB 연결 성공!' };
      } catch(e) {
        return { ok: false, message: '연결 실패: ' + e.message };
      }
    }

    // ── DB CRUD helpers ────────────────────────────────────────────────────────
    async function dbFetch(table, fallback, orderCol = 'code') {
      const sb = getSupabaseClient();
      if (sb) {
        try {
          const { data, error } = await sb.from(table).select('*').order(orderCol, { ascending: true });
          if (!error && Array.isArray(data) && data.length > 0) {
            setLocalItem('dd_' + table + '_list_v1', data);
            return data;
          }
        } catch(e) { /* fallback */ }
      }
      return getLocalItem('dd_' + table + '_list_v1', fallback);
    }

    async function dbSave(table, rowData, isEdit = false) {
      const sb = getSupabaseClient();
      let serverRow = null;
      if (sb) {
        try {
          if (isEdit && rowData.id) {
            const { id, created_at, ...payload } = rowData;
            const { data, error } = await sb.from(table).update(payload).eq('id', id).select().single();
            if (!error) serverRow = data;
          } else {
            const { id, ...payload } = rowData;
            const { data, error } = await sb.from(table).insert(payload).select().single();
            if (!error) serverRow = data;
          }
        } catch(e) { /* fallback */ }
      }
      const local = getLocalItem('dd_' + table + '_list_v1', []);
      let updated;
      if (isEdit && rowData.id) {
        updated = local.map(r => r.id === rowData.id ? { ...r, ...(serverRow || rowData) } : r);
      } else {
        const saved = serverRow || { ...rowData, id: table + '_' + Date.now() };
        updated = [saved, ...local.filter(r => r.id !== saved.id)];
      }
      setLocalItem('dd_' + table + '_list_v1', updated);
      return updated;
    }

    async function dbDelete(table, rowId) {
      const sb = getSupabaseClient();
      if (sb) {
        try { await sb.from(table).delete().eq('id', rowId); } catch(e) {}
      }
      const updated = (getLocalItem('dd_' + table + '_list_v1', [])).filter(r => r.id !== rowId);
      setLocalItem('dd_' + table + '_list_v1', updated);
      return updated;
    }

    async function dbSaveDocument(docData) {
      const sb = getSupabaseClient();
      const payload = {
        doc_type: docData.docType,
        doc_no: docData.docNo,
        doc_date: docData.docDate,
        doc_time: docData.docTime,
        customer_name: docData.customer?.name || '',
        customer_data: docData.customer || {},
        supplier_key: docData.supplierKey || '',
        supplier_data: docData.supplier || {},
        items: docData.items || [],
        vat: docData.vat || 0,
        vat_included: docData.vatIncluded !== false,
        paid: docData.paid || 0,
        remark: docData.remark || ''
      };
      if (sb) {
        try { await sb.from('documents').insert(payload); } catch(e) {}
      }
      const local = getLocalItem('dd_documents_history_v1', []);
      setLocalItem('dd_documents_history_v1', [{ ...payload, id: 'doc_' + Date.now(), created_at: new Date().toISOString() }, ...local]);
    }

create table if not exists customers (
  id uuid primary key default gen_random_uuid(),

  created_at timestamptz default now()
);
alter table customers disable row level security;

create table if not exists suppliers (

alter table suppliers disable row level security;

create table if not exists parts (

alter table parts disable row level security;

create table if not exists documents (

alter table documents disable row level security;`;

                      <td>{c.addr}</td>
                      <td>
                        <button className="btn btn-primary" style={{ fontSize: '10px', padding: '2px 6px', marginRight: '4px' }} onClick={() => onSelectCustomer(c)}>명세서 선택</button>
                        <button className="btn btn-red-outline" style={{ fontSize: '10px', padding: '2px 6px' }} onClick={() => onDeleteCustomer(c.id)}>삭제</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {showModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h3 style={{ marginBottom: '1rem', fontWeight: '900' }}>➕ 새 거래처 등록</h3>
                <div className="form-group"><label className="form-label">상호명 *</label><input type="text" className="form-input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
                <div className="form-group"><label className="form-label">담당자</label><input type="text" className="form-input" value={form.person} onChange={e => setForm({ ...form, person: e.target.value })} /></div>
                <div className="form-group"><label className="form-label">연락처</label><input type="text" className="form-input" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} /></div>
                <div className="form-group"><label className="form-label">주소</label><input type="text" className="form-input" value={form.addr} onChange={e => setForm({ ...form, addr: e.target.value })} /></div>
                <div style={{ display: 'flex', gap: '0.5rem', marginTop: '1rem' }}>
                  <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => { onSaveCustomer(form); setShowModal(false); }}>저장</button>
                  <button className="btn btn-outline" style={{ flex: 1 }} onClick={() => setShowModal(false)}>취소</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SupplierTab({ suppliers, onSelectSupplier }) {
      return (
        <div className="management-container">
          <div className="card-box">
            <div className="card-box-header">
              <h2 style={{ fontSize: '1.125rem', fontWeight: '900' }}>🏢 공급자 관리</h2>
            </div>
            <div className="mobile-cards-view">
              {suppliers.map(s => (
                <div key={s.id} className="mobile-data-card">
                  <div style={{ fontWeight: '900', fontSize: '0.9375rem', marginBottom: '0.25rem' }}>{s.name}</div>
                  <div style={{ fontSize: '0.75rem', color: '#4b5563', marginBottom: '0.5rem' }}>
                    <div>사업자번호: {s.bizno}</div>
                    <div>연락처: {s.phone || s.tel}</div>
                  </div>
                  <button className="btn btn-primary" style={{ width: '100%', minHeight: '36px', fontSize: '0.75rem' }} onClick={() => onSelectSupplier(s)}>명세서 공급자로 선택</button>
                </div>
              ))}
            </div>

            <div className="desktop-table-view">
              <table className="data-table">
                <thead>
                  <tr><th>Code</th><th>상호명</th><th>사업자번호</th><th>연락처</th><th>작업</th></tr>
                </thead>
                <tbody>
                  {suppliers.map(s => (
                    <tr key={s.id}>
                      <td>{s.code}</td>
                      <td style={{ fontWeight: '700' }}>{s.name}</td>
                      <td>{s.bizno}</td>
                      <td>{s.phone || s.tel}</td>
                      <td>
                        <button className="btn btn-primary" style={{ fontSize: '10px', padding: '2px 6px' }} onClick={() => onSelectSupplier(s)}>명세서 선택</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function PartsTab({ parts, onSelectPart }) {
      return (
        <div className="management-container">
          <div className="card-box">
            <div className="card-box-header">
              <h2 style={{ fontSize: '1.125rem', fontWeight: '900' }}>🛠️ 부품 및 재고 관리</h2>
            </div>

            <div className="mobile-cards-view">
              {parts.map(p => (
                <div key={p.id} className="mobile-data-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.25rem' }}>
                    <span style={{ fontWeight: '900', fontSize: '0.9375rem' }}>{p.name}</span>
                    <span style={{ fontSize: '0.6875rem', backgroundColor: '#dcfce7', color: '#166534', padding: '2px 6px', borderRadius: '9999px', fontWeight: '700' }}>재고 {p.stock}</span>
                  </div>
                  <div style={{ fontSize: '0.75rem', color: '#4b5563', marginBottom: '0.5rem' }}>
                    <div>단가: ₩ {Number(p.price).toLocaleString()} | 분류: {p.category}</div>
                  </div>
                  <button className="btn btn-primary" style={{ width: '100%', minHeight: '36px', fontSize: '0.75rem' }} onClick={() => onSelectPart(p)}>명세서 항목으로 선택</button>
                </div>
              ))}
            </div>

            <div className="desktop-table-view">
              <table className="data-table">
                <thead>
                  <tr><th>코드</th><th>품명</th><th>카테고리</th><th>단가</th><th>재고</th><th>작업</th></tr>
                </thead>
                <tbody>
                  {parts.map(p => (
                    <tr key={p.id}>
                      <td>{p.code}</td>
                      <td style={{ fontWeight: '700' }}>{p.name}</td>
                      <td>{p.category}</td>
                      <td>₩ {Number(p.price).toLocaleString()}</td>
                      <td>{p.stock}</td>
                      <td>
                        <button className="btn btn-primary" style={{ fontSize: '10px', padding: '2px 6px' }} onClick={() => onSelectPart(p)}>명세서 선택</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('doc');

      // Supabase 연결 상태
      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('supabase_url') || 'https://wmrfwrsaacolkpjyrffy.supabase.co');
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('supabase_anon_key') || 'sb_publishable_nWgVPKLg5hHZqvCrOL9oUQ_GfuAGe9Y');
      const [isConnected, setIsConnected] = useState(false);
      const [isTesting, setIsTesting] = useState(false);
      const [connectionMessage, setConnectionMessage] = useState('');

      const [suppliersList, setSuppliersList] = useState(() => getLocalItem('dd_suppliers_list_v1', INITIAL_SUPPLIERS_LIST));
      const [selectedSupplierKey, setSelectedSupplierKey] = useState(() => localStorage.getItem('selected_supplier_key') || 'sejin');
      const [currentSupplier, setCurrentSupplier] = useState(DEFAULT_SUPPLIERS.sejin);

      const [customersList, setCustomersList] = useState(() => getLocalItem('dd_customers_list_v1', DEMO_CUSTOMERS));
      const [customer, setCustomer] = useState({ name: '', person: '', phone: '', addr: '' });

      const [partsList, setPartsList] = useState(() => getLocalItem('dd_parts_list_v1', DEMO_PARTS));

      const [docType, setDocType] = useState('거래명세서');
      const [items, setItems] = useState([
        { id: '1', code: 'P0001', name: '엔진오일 필터', unit: 'EA', qty: 2, price: 25000 },
        { id: '2', code: 'P0002', name: '유압유 20L', unit: 'CAN', qty: 1, price: 85000 }
      ]);
      const [vatIncluded, setVatIncluded] = useState(true);
      const [vat, setVat] = useState(0);
      const [paid, setPaid] = useState(0);
      const [remark, setRemark] = useState('');

      // 날짜/시간/문서번호 초기화
      const [docDate, setDocDate] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      });
      const [docTime, setDocTime] = useState(() => {
        const now = new Date();
        return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      });
      const [docNo, setDocNo] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-001`;
      });

      useEffect(() => {
        const found = suppliersList.find(s => s.id === selectedSupplierKey);
        if (found) {
          setCurrentSupplier({ ...found, company: found.name, tel: found.phone || found.tel, hasStamp: selectedSupplierKey === 'sejin' });
        } else if (DEFAULT_SUPPLIERS[selectedSupplierKey]) {
          setCurrentSupplier(DEFAULT_SUPPLIERS[selectedSupplierKey]);
        }
        localStorage.setItem('selected_supplier_key', selectedSupplierKey);
      }, [selectedSupplierKey, suppliersList]);

      // Supabase 연결 테스트
      const handleTestConnection = async () => {
        setIsTesting(true);
        localStorage.setItem('supabase_url', supabaseUrl.trim());
        localStorage.setItem('supabase_anon_key', supabaseKey.trim());
        _sbClient = null; // 클라이언트 재생성 강제
        const result = await sbTestConnection(supabaseUrl, supabaseKey);
        setIsConnected(result.ok);
        setConnectionMessage(result.message);
        setIsTesting(false);
        if (result.ok && !result.isTableMissing) {
          // 모든 데이터 새로고침
          const [custs, supps, parts] = await Promise.all([
            dbFetch('customers', DEMO_CUSTOMERS),
            dbFetch('suppliers', INITIAL_SUPPLIERS_LIST),
            dbFetch('parts', DEMO_PARTS)
          ]);
          setCustomersList(custs);
          if (supps.length > 0) setSuppliersList(supps);
          if (parts.length > 0) setPartsList(parts);
        }
      };

      // 초기 자동 연결 시도
      useEffect(() => {
        if (supabaseUrl && supabaseKey) handleTestConnection();
      }, []);

      // 탭 전환 시 데이터 새로고침
      useEffect(() => {
        if (!isConnected) return;
        if (activeTab === 'customers') dbFetch('customers', DEMO_CUSTOMERS).then(setCustomersList);
        else if (activeTab === 'suppliers') dbFetch('suppliers', INITIAL_SUPPLIERS_LIST).then(d => { if(d.length>0) setSuppliersList(d); });
        else if (activeTab === 'parts') dbFetch('parts', DEMO_PARTS).then(d => { if(d.length>0) setPartsList(d); });
      }, [activeTab, isConnected]);

      // 고객 CRUD
      const handleSaveCustomer = async (c, isEdit) => {
        const updated = await dbSave('customers', c, isEdit);
        setCustomersList(updated);
        alert('✓ 거래처 정보가 저장되었습니다.');
      };
      const handleDeleteCustomer = async (id) => {
        if (!confirm('거래처를 삭제하시겠습니까?')) return;
        setCustomersList(await dbDelete('customers', id));
      };

      // 공급자 CRUD
      const handleSaveSupplier = async (s, isEdit) => {
        const updated = await dbSave('suppliers', s, isEdit);
        setSuppliersList(updated);
        alert('✓ 공급자 정보가 저장되었습니다.');
      };
      const handleDeleteSupplier = async (id) => {
        if (!confirm('공급자를 삭제하시겠습니까?')) return;
        setSuppliersList(await dbDelete('suppliers', id));
      };

      // 부품 CRUD
      const handleSavePart = async (p, isEdit) => {
        const updated = await dbSave('parts', p, isEdit);
        setPartsList(updated);
        alert('✓ 부품 정보가 저장되었습니다.');
      };
      const handleDeletePart = async (id) => {
        if (!confirm('부품을 삭제하시겠습니까?')) return;
        setPartsList(await dbDelete('parts', id));
      };

      // 문서 저장
      const handleSaveDocument = async () => {
        await dbSaveDocument({ docType, docNo, docDate, docTime, customer, supplier: currentSupplier, supplierKey: selectedSupplierKey, items, vat, vatIncluded, paid, remark });
        alert(`✓ ${docType} (번호: ${docNo}) 저장 완료!`);
      };

      const handleResetForm = () => {
        if (confirm('명세서 내용을 초기화하시겠습니까?')) {
          const now = new Date();
          setDocNo(`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(Math.floor(Math.random()*100)).padStart(3,'0')}`);
          setCustomer({ name: '', person: '', phone: '', addr: '' });
          setItems([{ id: Date.now().toString(), code: '', name: '', unit: 'EA', qty: 1, price: 0 }]);
          setPaid(0); setRemark('');
        }
      };

      return (
        <div className="app-container">
          <Header
            activeTab={activeTab} setActiveTab={setActiveTab}
            isConnected={isConnected} isTesting={isTesting}
            connectionMessage={connectionMessage}
            supabaseUrl={supabaseUrl} setSupabaseUrl={setSupabaseUrl}
            supabaseKey={supabaseKey} setSupabaseKey={setSupabaseKey}
            onTestConnection={handleTestConnection}
          />
          <main className="main-content">
            {activeTab === 'doc' && (
              <StatementTab
                docType={docType} setDocType={setDocType}
                docNo={docNo} setDocNo={setDocNo}
                docDate={docDate} setDocDate={setDocDate}
                docTime={docTime} setDocTime={setDocTime}
                selectedSupplierKey={selectedSupplierKey} setSelectedSupplierKey={setSelectedSupplierKey}
                suppliersList={suppliersList} currentSupplier={currentSupplier} setCurrentSupplier={setCurrentSupplier}
                customer={customer} setCustomer={setCustomer} customersList={customersList}
                items={items} setItems={setItems}
                vat={vat} setVat={setVat}
                vatIncluded={vatIncluded} setVatIncluded={setVatIncluded}
                paid={paid} setPaid={setPaid}
                remark={remark} setRemark={setRemark}
                onResetForm={handleResetForm}
                onSaveDocument={handleSaveDocument}
              />
            )}
            {activeTab === 'customers' && (
              <CustomerTab
                customers={customersList}
                onSaveCustomer={handleSaveCustomer}
                onDeleteCustomer={handleDeleteCustomer}
                onSelectCustomer={(c) => { setCustomer(c); setActiveTab('doc'); }}
              />
            )}
            {activeTab === 'suppliers' && (
              <SupplierTab
                suppliers={suppliersList}
                onSaveSupplier={handleSaveSupplier}
                onDeleteSupplier={handleDeleteSupplier}
                onSelectSupplier={(s) => { setSelectedSupplierKey(s.id); setActiveTab('doc'); }}
              />
            )}
            {activeTab === 'parts' && (
              <PartsTab
                parts={partsList}
                onSavePart={handleSavePart}
                onDeletePart={handleDeletePart}
                onSelectPart={(p) => { setItems([...items, { id: Date.now().toString(), code: p.code, name: p.name, unit: p.unit || 'EA', qty: 1, price: p.price }]); setActiveTab('doc'); }}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
